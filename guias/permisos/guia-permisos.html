<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Guía de Permisos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabecera con pestañas por rol; cada rol es un tutorial paso a paso (lista de pasos + captura y explicación). */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --ink: #1a2130;
  --muted: #5a6476;
  --line: #dfe3ea;
  --brand: #c8102e;
  --brand-soft: #fbe7ea;
  --info: #2357d1;
  --info-soft: #e7eefc;
  --ok: #157a3a;
  --ok-soft: #e3f4e9;
  --warn: #a95207;
  --warn-soft: #fdf0e1;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --violet: #6d3fd6;
  --violet-soft: #efe9fc;
  --shadow: 0 1px 2px rgba(20, 28, 45, .06), 0 6px 18px rgba(20, 28, 45, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --surface: #1a1f28; --surface-2: #222833; --ink: #e9ecf1; --muted: #9ba4b4; --line: #2c3341;
    --brand: #ff5c70; --brand-soft: #3b1a21; --info: #7aa2ff; --info-soft: #1d2a47; --ok: #5fd08a; --ok-soft: #173325;
    --warn: #f3a65a; --warn-soft: #3a2815; --bad: #ff7d72; --bad-soft: #3d1c1a; --violet: #b59bff; --violet-soft: #2a2245;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #1a1f28; --surface-2: #222833; --ink: #e9ecf1; --muted: #9ba4b4; --line: #2c3341;
  --brand: #ff5c70; --brand-soft: #3b1a21; --info: #7aa2ff; --info-soft: #1d2a47; --ok: #5fd08a; --ok-soft: #173325;
  --warn: #f3a65a; --warn-soft: #3a2815; --bad: #ff7d72; --bad-soft: #3d1c1a; --violet: #b59bff; --violet-soft: #2a2245;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; margin: 0; }
p { margin: 0; }
a { color: var(--info); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabecera */
.cab { background: var(--surface); border-bottom: 1px solid var(--line); }
.cab .wrap { padding-block: 28px 0; display: grid; gap: 18px; }
.cab-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.marca { display: flex; align-items: center; gap: 10px; font: 600 13px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.marca i { width: 10px; height: 10px; border-radius: 2px; background: var(--brand); display: inline-block; }
.cab h1 { font-size: clamp(28px, 4.4vw, 42px); line-height: 1.08; margin-top: 8px; }
.cab .lead { color: var(--muted); max-width: 62ch; margin-top: 8px; }
.meta { font: 500 12px/1.4 var(--f-mono); color: var(--muted); text-align: right; }
.meta b { color: var(--ink); font-weight: 500; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 14px 14px 12px; font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.tab .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); font-size: 12px; }
.tab[aria-selected="true"] .ico { background: var(--brand-soft); color: var(--brand); }

main .wrap { padding-block: 28px 56px; display: grid; gap: 28px; }
.intro { display: grid; gap: 6px; max-width: 72ch; }
.intro h2 { font-size: 26px; }
.intro p { color: var(--muted); }

/* Tutorial */
.tuto { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
.pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.paso-btn { width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; cursor: pointer; color: var(--muted); }
.paso-btn:hover { background: var(--surface); color: var(--ink); }
.paso-btn .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 500 12px/1 var(--f-mono); color: var(--muted); background: var(--surface); }
.paso-btn .t { font-weight: 600; font-size: 14.5px; line-height: 1.35; padding-top: 3px; }
.paso-btn[aria-current="step"] { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
.paso-btn[aria-current="step"] .n { background: var(--brand); border-color: var(--brand); color: #fff; }
.paso-btn.visto .n { border-color: var(--brand); color: var(--brand); }

.escena { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); min-height: 420px; overflow: hidden; }
.escena-img { background: var(--surface-2); padding: 24px; display: grid; place-items: center; border-right: 1px solid var(--line); }
.escena-img.vacia { min-width: 220px; }
.marco { border-radius: 18px; overflow: hidden; border: 6px solid #232a36; background: #232a36; box-shadow: 0 10px 30px rgba(0,0,0,.18); cursor: zoom-in; max-width: 100%; }
.marco img { display: block; width: 100%; height: auto; }
.marco.tel { width: 320px; }
.marco.web { width: 460px; border-radius: 10px; border-width: 0; border-top: 22px solid #232a36; position: relative; }
.marco.web::before { content: ""; position: absolute; top: -14px; left: 10px; width: 36px; height: 7px; background: radial-gradient(circle at 3.5px 3.5px, #ff6159 3px, transparent 3.5px), radial-gradient(circle at 17.5px 3.5px, #ffbd2e 3px, transparent 3.5px), radial-gradient(circle at 31.5px 3.5px, #28c941 3px, transparent 3.5px); }
.marco.recorte { border-width: 0; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); width: 340px; }
.sin-img { display: grid; place-items: center; gap: 10px; text-align: center; color: var(--muted); font-size: 14px; max-width: 220px; }
.sin-img .gran { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-size: 30px; }
.escena-txt { padding: 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
.escena-txt h3 { font-size: 23px; line-height: 1.2; }
.escena-txt .cuerpo { display: grid; gap: 12px; color: var(--ink); max-width: 60ch; }
.escena-txt .cuerpo p, .escena-txt .cuerpo li { color: var(--ink); }
.escena-txt ul, .escena-txt ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.nota { border-radius: 10px; padding: 10px 12px; font-size: 14.5px; display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
.nota::before { font: 700 13px/20px var(--f-body); text-align: center; border-radius: 50%; width: 20px; height: 20px; }
.nota.info { background: var(--info-soft); } .nota.info::before { content: "i"; background: var(--info); color: var(--surface); }
.nota.warn { background: var(--warn-soft); } .nota.warn::before { content: "!"; background: var(--warn); color: var(--surface); }
.nota.ok { background: var(--ok-soft); } .nota.ok::before { content: "✓"; background: var(--ok); color: var(--surface); }
.kbd { font: 600 13.5px/1 var(--f-body); background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.nav-pasos { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav-pasos .prog { flex: 1; min-width: 100px; height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.nav-pasos .prog i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transition: width .25s; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--brand); }

/* Bloques de referencia */
.bloque { display: grid; gap: 14px; }
.bloque > h2 { font-size: 22px; }
.bloque > p.sub { color: var(--muted); margin-top: -8px; max-width: 70ch; }
.tabla-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14.5px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px/1.3 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td b { font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.c-azul { background: var(--info-soft); color: var(--info); }
.c-violeta { background: var(--violet-soft); color: var(--violet); }
.c-verde { background: var(--ok-soft); color: var(--ok); }
.c-rojo { background: var(--bad-soft); color: var(--bad); }
.c-ambar { background: var(--warn-soft); color: var(--warn); }
.c-gris { background: var(--surface-2); color: var(--muted); }

.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.fig img { width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.fig figcaption { font-size: 14px; color: var(--muted); }
.fig figcaption b { color: var(--ink); }

/* Flujo de estados */
.flujo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.carril { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; }
.carril h3 { font-size: 17px; }
.carril .de { font-size: 13.5px; color: var(--muted); margin-top: -6px; }
.cadena { display: grid; gap: 8px; }
.eslabon { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.eslabon .flecha { width: 22px; display: grid; justify-items: center; color: var(--muted); font-size: 13px; padding-top: 4px; }
.eslabon p { font-size: 14.5px; }
.ramas { display: flex; flex-wrap: wrap; gap: 6px; }

/* Calculadora */
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); overflow: hidden; }
.calc-in { padding: 22px; display: grid; gap: 14px; border-right: 1px solid var(--line); align-content: start; }
.campo { display: grid; gap: 6px; }
.campo label, .campo .lbl { font: 600 12.5px/1.2 var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.campo select, .campo input[type="number"] { font: 500 15px/1.2 var(--f-body); padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.campo input[type="range"] { width: 100%; accent-color: var(--violet); }
.fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.calc-out { padding: 22px 26px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.cifra { font: 700 40px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.cifra small { font: 500 15px/1 var(--f-body); color: var(--muted); margin-left: 6px; }
.linea-tiempo { position: relative; height: 46px; border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.linea-tiempo span { position: absolute; top: 0; bottom: 0; }
.lt-permiso { background: var(--info); opacity: .85; }
.lt-desc { background: repeating-linear-gradient(45deg, var(--muted) 0 3px, transparent 3px 7px); opacity: .55; }
.lt-eje { display: flex; justify-content: space-between; font: 500 11.5px/1 var(--f-mono); color: var(--muted); margin-top: 6px; }
.reparto { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.reparto i { display: block; height: 100%; transition: width .25s; }
.r-bolsa { background: var(--violet); } .r-vac { background: var(--info); } .r-rol { background: var(--bad); } .r-med { background: var(--ok); }
.leyenda { display: grid; gap: 8px; }
.leyenda div { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14.5px; }
.leyenda div i { width: 12px; height: 12px; border-radius: 3px; }
.leyenda div b { font-variant-numeric: tabular-nums; font-weight: 600; }
.explica { font-size: 14.5px; color: var(--muted); }

/* Preguntas */
.faq { display: grid; gap: 8px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.faq summary { cursor: pointer; padding: 14px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font: 500 18px/1 var(--f-mono); color: var(--muted); }
.faq details[open] summary::after { content: "−"; }
.faq .resp { padding: 0 16px 16px; color: var(--muted); display: grid; gap: 8px; max-width: 75ch; }

.cambios { font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.cambios li { list-style: none; display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
.cambios ul { padding: 0; margin: 0; display: grid; gap: 6px; }
.cambios time { font: 500 12.5px/1.6 var(--f-mono); color: var(--ink); }

/* Visor de imagen */
.visor { position: fixed; inset: 0; z-index: 20; background: rgba(10, 13, 19, .82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.visor img { max-width: min(100%, 900px); max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.visor button { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }

@media (max-width: 900px) {
  .tuto { grid-template-columns: minmax(0, 1fr); }
  .pasos { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .pasos li { flex: 0 0 auto; }
  .paso-btn { grid-template-columns: 24px auto; padding: 8px 10px; background: var(--surface); border-color: var(--line); }
  .paso-btn .t { font-size: 13.5px; white-space: nowrap; padding-top: 2px; }
  .paso-btn .n { width: 24px; height: 24px; }
  .escena { grid-template-columns: minmax(0, 1fr); }
  .escena-img { border-right: 0; border-bottom: 1px solid var(--line); padding: 18px; }
  .calc { grid-template-columns: minmax(0, 1fr); }
  .calc-in { border-right: 0; border-bottom: 1px solid var(--line); }
  .flujo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .marco.tel { width: 100%; max-width: 300px; }
  .marco.web, .marco.recorte { width: 100%; }
  .escena-txt { padding: 20px 18px; }
  .meta { text-align: left; }
}
/* ---------- Teléfonos ---------- */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, .marco, .tab, .paso-btn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.escena { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 58px); }
.desliza { display: none; }
@media (max-width: 640px) {
  body { font-size: 15.5px; }
  .cab .wrap { padding-block: 16px 0; gap: 10px; }
  .cab h1 { font-size: 27px; margin-top: 6px; }
  .cab .lead { font-size: 14.5px; line-height: 1.5; }
  .meta { font-size: 11px; padding-bottom: 12px; }
  .meta br { display: none; }
  .meta b:first-of-type::after { content: " · "; color: var(--muted); }
  .tab { padding: 12px 10px 10px; font-size: 14.5px; gap: 6px; }
  main .wrap { padding-block: 18px 40px; gap: 22px; }
  .intro h2 { font-size: 21px; }
  .intro p { font-size: 14.5px; }
  .tuto { gap: 14px; }
  .pasos { margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; scrollbar-width: none; }
  .pasos::-webkit-scrollbar { display: none; }
  .escena { min-height: 0; border-radius: 14px; overflow: clip; }
  .escena-img { padding: 14px; }
  .marco { border-width: 4px; border-radius: 14px; }
  .marco.tel { width: min(100%, 250px, 30vh); max-width: none; }
  .marco.web { border-width: 0; border-top-width: 18px; }
  .marco.web::before { top: -12px; }
  .escena-txt { padding: 16px 16px 0; gap: 10px; }
  .escena-txt h3 { font-size: 19px; }
  .escena-txt .cuerpo { gap: 10px; }
  .desliza { display: block; font-size: 12.5px; color: var(--muted); text-align: center; margin-top: -4px; }
  .nav-pasos { position: sticky; bottom: 0; z-index: 2; margin: 4px -16px 0; padding: 10px 16px max(10px, env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); flex-wrap: nowrap; }
  .nav-pasos .prog { min-width: 40px; }
  .btn { padding: 11px 14px; min-height: 44px; }
  .bloque > h2 { font-size: 19px; }
  .tabla-wrap { overflow: visible; background: none; border: 0; border-radius: 0; }
  .tabla-wrap table, .tabla-wrap tbody, .tabla-wrap tr, .tabla-wrap td { display: block; min-width: 0; width: 100%; }
  .tabla-wrap thead { display: none; }
  .tabla-wrap tbody { display: grid; gap: 10px; }
  .tabla-wrap tr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
  .tabla-wrap td { border-bottom: 1px solid var(--line); padding: 9px 0; }
  .tabla-wrap tr td:last-child { border-bottom: 0; }
  .tabla-wrap td[data-l]::before { content: attr(data-l); display: block; font: 600 11px/1.3 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .tabla-wrap td:first-child::before { display: none; }
  .tabla-wrap td:first-child { font-weight: 600; }
  .calc-in, .calc-out { padding: 16px; }
  .cifra { font-size: 34px; }
  .carril { padding: 14px; }
  .faq summary { padding: 13px 14px; }
  .faq .resp { padding: 0 14px 14px; }
  .cambios li { grid-template-columns: 1fr; gap: 2px; }

<script>
/* ====================== Comportamiento (no hace falta editar) ====================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const estadoPaso = {};
try { Object.assign(estadoPaso, JSON.parse(localStorage.getItem('guiaPermisosPasos') || '{}')); } catch (e) { }
const guardarPasos = () => { try { localStorage.setItem('guiaPermisosPasos', JSON.stringify(estadoPaso)); } catch (e) { } };

$('#metaVersion').textContent = VERSION;
$('#metaFecha').textContent = FECHA;

function pintarTabs(actual) {
  $('#tabs').innerHTML = VISTAS.map(v => `<button type="button" role="tab" class="tab" data-v="${v.id}" aria-selected="${v.id === actual}"><span class="ico">${v.ico}</span>${esc(v.nombre)}</button>`).join('');
}

function htmlTutorial(id) {
  const pasos = PASOS[id];
  return `<div class="tuto" data-tuto="${id}">
    <ol class="pasos" aria-label="Pasos">${pasos.map((p, i) => `<li><button type="button" class="paso-btn" data-i="${i}"><span class="n">${i + 1}</span><span class="t">${esc(p.t)}</span></button></li>`).join('')}</ol>
    <article class="escena" aria-live="polite"></article>
  </div>`;
}

function pintarPaso(id, i, desplazar) {
  const pasos = PASOS[id];
  i = Math.max(0, Math.min(pasos.length - 1, i));
  estadoPaso[id] = i; guardarPasos();
  const p = pasos[i];
  const tuto = $(`[data-tuto="${id}"]`);
  tuto.querySelectorAll('.paso-btn').forEach((b, k) => {
    b.toggleAttribute('aria-current', k === i);
    if (k === i) b.setAttribute('aria-current', 'step');
    b.classList.toggle('visto', k < i);
  });
  const imgHtml = p.img
    ? `<div class="escena-img"><div class="marco ${p.marco || 'tel'}" data-zoom="img/${p.img}" role="button" tabindex="0" aria-label="Ver captura en grande"><img src="img/${p.img}" alt="Captura: ${esc(p.t)}" loading="lazy"></div></div>`
    : `<div class="escena-img vacia"><div class="sin-img"><div class="gran" aria-hidden="true">${p.icono || '•'}</div>Sin pantalla propia</div></div>`;
  tuto.querySelector('.escena').innerHTML = `${imgHtml}
    <div class="escena-txt">
      <div class="eyebrow">Paso ${i + 1} de ${pasos.length}</div>
      <h3>${esc(p.t)}</h3>
      <div class="cuerpo">${p.h}</div>
      <p class="desliza">Desliza la captura o usa los botones para cambiar de paso</p>
      <div class="nav-pasos">
        <button type="button" class="btn" data-mover="-1" ${i === 0 ? 'disabled' : ''}>← Anterior</button>
        <div class="prog" aria-hidden="true"><i style="width:${((i + 1) / pasos.length) * 100}%"></i></div>
        ${i < pasos.length - 1 ? `<button type="button" class="btn pri" data-mover="1">Siguiente →</button>` : siguienteVista(id)}
      </div>
    </div>`;
  const activo = tuto.querySelector(`.paso-btn[data-i="${i}"]`);
  if (activo && window.matchMedia('(max-width: 900px)').matches) {
    const fila = activo.closest('.pasos');
    fila.scrollTo({ left: activo.offsetLeft - (fila.clientWidth - activo.offsetWidth) / 2, behavior: 'smooth' });
  }
  const escena = tuto.querySelector('.escena');
  if (desplazar && esMovil() && escena.getBoundingClientRect().top < 0) escena.scrollIntoView({ block: 'start' });
}

function siguienteVista(id) {
  const k = VISTAS.findIndex(v => v.id === id);
  const sig = VISTAS[k + 1];
  return sig ? `<button type="button" class="btn pri" data-ir="${sig.id}">${esc(sig.nombre)} →</button>` : '';
}

      </div></div>
  </div></section>`;

const CALC = `<section class="bloque"><h2>Calculadora de un permiso por horas</h2>
  <p class="sub">Simula cómo se cobra. Es una estimación con las mismas reglas de la app; el valor oficial es el que muestra la app al enviar.</p>
  <div class="calc">

      <div class="fila2">
        <div class="campo"><label for="cSale">Sale a las</label><select id="cSale"></select></div>
        <div class="campo"><label for="cRegresa">Regresa a las</label><select id="cRegresa"></select></div>

      <div class="campo"><label for="cVac">Saldo de vacaciones (días)</label><input type="number" id="cVac" min="0" max="60" step="1" value="11"></div>

      <div><div class="linea-tiempo" id="cLinea"></div><div class="lt-eje"><span>07:30</span><span>10:00</span><span>12:30</span><span>16:15</span></div></div>
      <div class="reparto" id="cReparto"></div>
      <div class="leyenda" id="cLeyenda"></div>
      <p class="explica" id="cExplica"></p>
    </div>
  </div></section>`;

const FAQ = [
  ['¿El tiempo de la bolsa pasa al mes siguiente?', 'No. La bolsa de 4 horas es por período de nómina (26 al 25) y se renueva completa. Lo que no se usa se pierde.'],
  ['¿Las horas cargadas a vacaciones se pierden al cambiar de año?', 'No. Cada 8 horas se descuenta 1 día. Si al 30 de noviembre quedan horas que no llegan a 8, pasan al año de vacaciones siguiente.'],
  ['¿Qué pasa con los atrasos y faltantes que superan la bolsa?', 'Desde el 26/11/2026 se acumulan contra tus vacaciones: cada 8 horas descuentan 1 día. Se calcula cada noche y, si un supervisor justifica el día antes del cierre del período (25), se devuelve. Solo cuando ya no tienes vacaciones va al rol.'],
  ['¿Qué pasa si no tengo bolsa ni vacaciones?', 'Igual puedes pedir el permiso. La app te avisa que el tiempo se descontará del rol y debes aceptarlo antes de enviar.'],
  ['¿Tengo que marcar la salida y la entrada de un permiso por horas?', 'No. El horario pedido manda: el sistema descuenta ese tramo de la jornada. Si marcas igual, no se cuenta dos veces.'],
  ['¿Puedo cancelar una solicitud?', 'Sí, mientras espera al jefe o a TTHH. Una vez aprobada o registrada, habla con TTHH.'],
  ['¿Qué pasa si mi jefe no responde?', 'La solicitud deja de ser válida al cumplirse el plazo (el inicio del permiso, o al menos 8 horas laborables si ya había empezado o es médico o calamidad). No pasa a TTHH. Recuérdaselo a tu jefe antes.'],
  ['¿Qué ve el colaborador de sus vacaciones?', 'Con la opción activa en Configuración, solo días completos: saldo, días descontados por permisos y días pendientes. Las fracciones de hora las ve el supervisor en el panel.'],
  ['¿Qué datos van en los WhatsApp?', 'Solo el nombre corto y el ID. Fechas, motivos y documentos se ven en la app o en el panel.']
];

function htmlFaq() {
  return `<section class="bloque"><h2>Preguntas frecuentes</h2><div class="faq">${FAQ.map(([q, a]) => `<details><summary>${esc(q)}</summary><div class="resp"><p>${esc(a)}</p></div></details>`).join('')}</div></section>
  <section class="bloque"><h2>Cambios de la guía</h2><div class="cambios"><ul>${CAMBIOS.map(([f, t]) => `<li><time>${esc(f)}</time><span>${esc(t)}</span></li>`).join('')}</ul></div></section>`;
}

const EXTRA = {
  colaborador: TABLA_TIPOS + GALERIA_ESTADOS,
  jefe: FLUJO,
  panel: '',
  marcacion: '',
  reglas: ''
};

function pintarVista(id) {
  const v = VISTAS.find(x => x.id === id) || VISTAS[0];
  pintarTabs(v.id);
  const intro = `<div class="intro"><h2>${esc(v.titulo)}</h2><p>${esc(v.intro)}</p></div>`;
  if (v.id === 'reglas') {
    $('#vista').innerHTML = intro + REGLAS + CALC + FLUJO + htmlFaq();
    montarCalc();
  } else {
    $('#vista').innerHTML = intro + htmlTutorial(v.id) + (EXTRA[v.id] || '');
    pintarPaso(v.id, estadoPaso[v.id] || 0);
  }
  etiquetarTablas();
}

const REGLAS = `<section class="bloque"><h2>Las tres reglas</h2>
  <div class="galeria">
    <figure class="fig"><img src="img/02-bolsa.png" data-zoom="img/02-bolsa.png" alt="Tarjeta de la bolsa de 4 horas"><figcaption><b>1. Bolsa de 4 horas.</b> Por período de nómina (26 al 25). Cubre atrasos, faltantes y permisos personales. No pasa al siguiente período.</figcaption></figure>
    <figure class="fig"><img src="img/03-vacaciones.png" data-zoom="img/03-vacaciones.png" alt="Tarjeta de vacaciones"><figcaption><b>2. Vacaciones.</b> Lo que excede la bolsa se acumula: cada 8 h descuentan 1 día. Las horas sueltas pasan al año siguiente.</figcaption></figure>
    <figure class="fig"><img src="img/04-rol.png" data-zoom="img/04-rol.png" alt="Tarjeta de descuento al rol"><figcaption><b>3. Descuento al rol.</b> Lo que no cubren ni la bolsa ni las vacaciones, los permisos no aprobados y los médicos sin certificado.</figcaption></figure>
  </div></section>`;

/* ---------- Calculadora ---------- */
const INI = 450, FIN = 975, DESCANSOS = [[600, 615], [750, 780]];
const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const dur = m => { const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h} h ${r} min` : h ? `${h} h` : `${r} min`; };
const calc = { tipo: 'PERSONAL', sale: 600, regresa: 720 };

function montarCalc() {
  const sSale = $('#cSale'), sReg = $('#cRegresa');
  const opciones = (desde, hasta, elegida, finTxt) => { let h = ''; for (let m = desde; m <= hasta; m += 15) h += `<option value="${m}" ${m === elegida ? 'selected' : ''}>${hm(m)}${m === FIN && finTxt ? ' · fin de la jornada' : ''}</option>`; return h; };
  const llenar = () => {
    sSale.innerHTML = opciones(INI, FIN - 15, calc.sale);
    if (calc.regresa <= calc.sale) calc.regresa = Math.min(FIN, calc.sale + 60);
    sReg.innerHTML = opciones(calc.sale + 15, FIN, calc.regresa, true);
  };
  llenar();
  sSale.addEventListener('change', () => { calc.sale = +sSale.value; llenar(); calcular(); });
  sReg.addEventListener('change', () => { calc.regresa = +sReg.value; calcular(); });
  $('#cBolsa').addEventListener('input', calcular);
  $('#cVac').addEventListener('input', calcular);
  document.querySelectorAll('[data-tipo]').forEach(b => b.addEventListener('click', () => {
    calc.tipo = b.dataset.tipo;
    document.querySelectorAll('[data-tipo]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    calcular();
  }));
  calcular();
}

function calcular() {
  const a = calc.sale, b = calc.regresa, total = FIN - INI;
  let desc = 0;
  DESCANSOS.forEach(([x, y]) => { desc += Math.max(0, Math.min(b, y) - Math.max(a, x)); });
  const min = Math.max(0, b - a - desc);
  const bolsaLibre = +$('#cBolsa').value;
  $('#cBolsaTxt').textContent = dur(bolsaLibre) === '0 min' ? '0 min' : dur(bolsaLibre);
  const vacMin = Math.max(0, +$('#cVac').value || 0) * 480;
  $('#cMin').innerHTML = `${dur(min)}<small>de permiso</small>`;
  const pos = m => ((m - INI) / total * 100).toFixed(2) + '%';
  $('#cLinea').innerHTML = `<span class="lt-permiso" style="left:${pos(a)};width:${((b - a) / total * 100).toFixed(2)}%"></span>` +
    DESCANSOS.map(([x, y]) => `<span class="lt-desc" style="left:${pos(x)};width:${((y - x) / total * 100).toFixed(2)}%" title="${x === 600 ? 'Receso' : 'Almuerzo'}"></span>`).join('');
  let partes, texto;
  if (calc.tipo === 'MEDICO') {
    partes = [['r-med', 'Tiempo médico (con certificado)', min]];
    texto = `No usa la bolsa ni las vacaciones. Si en 72 h no hay certificado, estas ${dur(min)} se descuentan del rol.`;
  } else {
    const deBolsa = Math.min(bolsaLibre, min);
    const deVac = Math.min(vacMin, min - deBolsa);
    const deRol = min - deBolsa - deVac;
    partes = [['r-bolsa', 'Bolsa de 4 horas', deBolsa], ['r-vac', 'A vacaciones', deVac], ['r-rol', 'Descuento al rol', deRol]];
    texto = deBolsa === min ? 'La bolsa lo cubre todo: no hace falta aceptar ningún cargo.'
      : `Supera la bolsa: el formulario pide aceptar el cargo de ${dur(min - deBolsa)}${deVac ? ` (${dur(deVac)} a vacaciones; cada 8 h acumuladas descuentan 1 día)` : ''}${deRol ? `${deVac ? ' y' : ''} ${dur(deRol)} al rol` : ''}.`;
  }
  $('#cReparto').innerHTML = min ? partes.map(([c, , m]) => `<i class="${c}" style="width:${(m / min * 100).toFixed(2)}%"></i>`).join('') : '';
  $('#cLeyenda').innerHTML = partes.map(([c, t, m]) => `<div><i class="${c}"></i><span>${t}</span><b>${dur(m)}</b></div>`).join('');
  const descTxt = desc ? ` Se restaron ${dur(desc)} de ${DESCANSOS.filter(([x, y]) => Math.min(b, y) > Math.max(a, x)).map(([x]) => x === 600 ? 'receso' : 'almuerzo').join(' y ')}.` : '';
  $('#cExplica').textContent = texto + descTxt;
}

/* ---------- Navegación ---------- */
function vistaDeHash() { const h = location.hash.replace('#', ''); return VISTAS.some(v => v.id === h) ? h : VISTAS[0].id; }
function ir(id) { if (location.hash !== '#' + id) location.hash = id; else pintarVista(id); window.scrollTo({ top: 0 }); }
window.addEventListener('hashchange', () => pintarVista(vistaDeHash()));

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if (tab) { ir(tab.dataset.v); return; }
  const irA = e.target.closest('[data-ir]'); if (irA) { ir(irA.dataset.ir); return; }
  const pb = e.target.closest('.paso-btn'); if (pb) { pintarPaso(pb.closest('[data-tuto]').dataset.tuto, +pb.dataset.i); return; }
  const mv = e.target.closest('[data-mover]'); if (mv) { const id = mv.closest('[data-tuto]').dataset.tuto; pintarPaso(id, (estadoPaso[id] || 0) + +mv.dataset.mover, true); return; }
  const z = e.target.closest('[data-zoom]'); if (z) { abrirVisor(z.dataset.zoom); return; }
});
document.addEventListener('keydown', e => {
  if (!$('#visor').hidden) { if (e.key === 'Escape') cerrarVisor(); return; }
  const z = e.target.closest && e.target.closest('[data-zoom]');
  if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); abrirVisor(z.dataset.zoom); return; }
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const t = document.querySelector('[data-tuto]');
  if (t && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const id = t.dataset.tuto; pintarPaso(id, (estadoPaso[id] || 0) + (e.key === 'ArrowRight' ? 1 : -1)); }
});

function abrirVisor(src) { const v = $('#visor'); v.querySelector('img').src = src; v.hidden = false; v.querySelector('button').focus(); }
function cerrarVisor() { $('#visor').hidden = true; }
$('#visor').addEventListener('click', cerrarVisor);

/* ---------- Teléfonos: tablas en tarjetas y deslizar entre pasos ---------- */
const esMovil = () => window.matchMedia('(max-width: 640px)').matches;
function etiquetarTablas() {
  document.querySelectorAll('.tabla-wrap table').forEach(t => {
    const cab = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, k) => { if (cab[k]) td.dataset.l = cab[k]; }));
  });
}
let toque = null;
document.addEventListener('touchstart', e => {
  const esc = e.target.closest('.escena');
  toque = esc && e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, id: esc.closest('[data-tuto]').dataset.tuto } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!toque) return;
  const dx = e.changedTouches[0].clientX - toque.x, dy = e.changedTouches[0].clientY - toque.y;
  const id = toque.id; toque = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) pintarPaso(id, (estadoPaso[id] || 0) + (dx < 0 ? 1 : -1), true);
}, { passive: true });

pintarVista(vistaDeHash());
</script>
