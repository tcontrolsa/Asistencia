<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Catering - Control de Almuerzos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="./CSS/catering.css">
    <!-- FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="./JS/firebase_backend.js?v=20260716_01"></script>
    <script>window.USE_FIREBASE = true;</script>
</head>
<body>

<div id="login-catering" class="login-overlay hidden">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock-fill"></i>
            <h2>Acceso Catering</h2>
            <p>ID y PIN de Supervisor</p>
        </div>
        <div class="login-body">
            <div class="mb-3">
                <label class="form-label">ID Empleado</label>
                <input type="text" id="supId" class="form-control" placeholder="Ej: 123">
            </div>
            <div class="mb-3">
                <label class="form-label">PIN</label>
                <input type="password" id="supPin" class="form-control" placeholder="••••" maxlength="4">
            </div>
            <button class="btn-login" onclick="intentarLoginCatering()">Ingresar</button>
            <div id="login-error" class="error-msg hidden"></div>
        </div>
    </div>
</div>

<div class="app-container">
    <div class="header">
        <h1><i class="bi bi-egg-fried"></i> Catering</h1>
        <p>Control de almuerzos en planta</p>
        <button class="refresh-btn" onclick="window.manualRefresh()" title="Actualizar">
            <i class="bi bi-arrow-repeat"></i>
        </button>
    </div>

    <div class="stats-row">
        <button class="stat-btn total active" onclick="filtrarPor('todos')">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">TOTAL</div>
        </button>
        <button class="stat-btn pending" onclick="filtrarPor('pendientes')">
            <div class="stat-number" id="pendingCount">0</div>
            <div class="stat-label">PENDIENTES</div>
        </button>
        <button class="stat-btn consumed" onclick="filtrarPor('consumidos')">
            <div class="stat-number" id="consumedCount">0</div>
            <div class="stat-label">CONSUMIDOS</div>
        </button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o ID..." oninput="filtrarLista()">
    </div>

    <div class="main-content" id="mainContent">
        <div id="employeeList" class="employee-list">
            <div class="empty-state">
                <i class="bi bi-hourglass-split"></i>
                <p>Cargando lista de almuerzos...</p>
            </div>
        </div>
    </div>

    <div class="last-update" id="lastUpdate">
        Actualizando...
    </div>
</div>

<script src="./JS/catering_core.js?v=20260716_01"></script>
</body>
</html>
