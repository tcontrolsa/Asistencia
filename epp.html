<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <title>Mis EPP · TCONTROL</title>
    <link rel="icon" href="./assets/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./CSS/epp.css?v=20261116_01">
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="./JS/firebase_backend.js?v=20261029_01"></script>
    <script>window.USE_FIREBASE = true;</script>
</head>
<body>
    <!-- Módulo EPP, página del colaborador (JS/epp_usuario.js). Datos: JS/epp_api.js; en localhost con ?demo, JS/epp_datos.js -->
    <div id="eppApp"></div>
    <script>
    // Módulo EPP aún no habilitado: en producción solo se muestra "Próximamente".
    // En localhost (pruebas) se carga normal. Para habilitarlo, quitar este bloque y volver a poner los scripts.
    (function () {
      var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if (!local) {
        document.getElementById('eppApp').innerHTML =
          '<main style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:Inter,system-ui,sans-serif;color:#e2e8f0">' +
          '<i class="fas fa-hard-hat" style="font-size:44px;color:#f59e0b"></i>' +
          '<h1 style="margin:0;font-size:26px">Próximamente</h1>' +
          '<p style="margin:0;color:#94a3b8;max-width:320px">Mis EPP estará disponible muy pronto. Te avisaremos cuando puedas usarlo.</p></main>';
        document.body.style.background = '#0f172a';
        return;
      }
      [
        './JS/epp_matriz.js?v=20261116_01',
        './JS/epp_datos.js?v=20261116_01',
        './JS/epp_api.js?v=20261116_01',
        './JS/epp_firma.js?v=20261105_01',
        './JS/epp_usuario.js?v=20261116_01'
      ].forEach(function (u) { document.write('<script src="' + u + '"><\/script>'); });
    })();
    </script>
</body>
</html>
