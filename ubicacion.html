<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TCONTROL - Rastreo en Vivo</title>
  <meta name="description" content="Monitoreo de ubicación premium para empleados">
  
  <!-- Modern premium fonts: Outfit for display, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
  
  <link rel="stylesheet" href="./CSS/ubicacion.css">
  <!-- FIREBASE SDKS -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="./JS/firebase_backend.js?v=20260703_11"></script>
  <script>window.USE_FIREBASE = true;</script>
</head>
<body>

<!-- Global Loader -->
<div class="loader-overlay" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text" id="loaderText">Sincronizando coordenadas...</div>
</div>

<button class="mob-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>

<div class="app-wrapper">
  
  <div id="map"></div>

  <!-- Controles Mapa Flotantes -->
  <div class="map-fab-group">
    <div class="map-fab" onclick="centrarEmpresa()" title="Ir a Centro de Control"><i class="fas fa-crosshairs"></i></div>
    <div class="map-fab" onclick="fitAll()" title="Ver a Todo el Personal"><i class="fas fa-users-viewfinder"></i></div>
    <div class="map-fab" id="btnRadio" onclick="toggleRadio()" title="Mostrar Geocerca"><i class="fas fa-draw-polygon"></i></div>
  </div>

  <!-- Overlay Estado en Vivo -->
  <div class="live-status-overlay" id="liveBar">
    <div class="live-pulse"><div class="live-pulse-dot"></div> TRANSMISIÓN ACTIVA</div>
    <div style="width: 1px; height: 16px; background: var(--border-dark);"></div>
    <div>Sincronizado: <span class="mono-data" id="ultimaAct">--:--:--</span></div>
    <div style="width: 1px; height: 16px; background: var(--border-dark);"></div>
    <div>Próxima recarga en <span class="mono-data" id="proxAct" style="color: var(--brand);">60s</span></div>
  </div>

  <!-- Leyenda Moderna -->
  <div class="modern-legend">
    <div class="leg-title">Indicadores GPS</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--c-empresa)"></div> Dentro del recinto</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--c-campo)"></div> En campo</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--c-salida)"></div> Fin de jornada</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--c-sin)"></div> Desconectado / Sin registro</div>
  </div>

  <!-- Panel Lateral Glass -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-brand">
        <div class="sb-logo-box"><i class="fas fa-layer-group"></i></div>
        <div>
          <div class="sb-title">CONTROL DE CAMPO</div>
          <div class="sb-sub">Radar en tiempo real interactivo</div>
        </div>
      </div>
    </div>

    <!-- Grilla Filtros -->
    <div class="filter-grid">
      <div class="filter-btn active" id="f-todos" onclick="filtrar('todos')">
        <div class="f-val" id="numTodos" style="color:var(--text-main)">-</div>
        <div class="f-lbl">Total</div>
      </div>
      <div class="filter-btn" id="f-empresa" onclick="filtrar('empresa')">
        <div class="f-val" id="numEmpresa" style="color:var(--c-empresa)">-</div>
        <div class="f-lbl" style="color:var(--c-empresa)">Dentro</div>
      </div>
      <div class="filter-btn" id="f-campo" onclick="filtrar('campo')">
        <div class="f-val" id="numCampo" style="color:var(--c-campo)">-</div>
        <div class="f-lbl" style="color:var(--c-campo)">Campo</div>
      </div>
      <div class="filter-btn" id="f-salida" onclick="filtrar('salida')">
        <div class="f-val" id="numSalida" style="color:var(--c-salida)">-</div>
        <div class="f-lbl" style="color:var(--c-salida)">Salida</div>
      </div>
      <div class="filter-btn" id="f-sin" onclick="filtrar('sin')">
        <div class="f-val" id="numSin" style="color:var(--c-sin)">-</div>
        <div class="f-lbl" style="color:var(--text-sub)">Faltan</div>
      </div>
    </div>

    <div class="sb-search">
      <div class="search-input-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchEmp" class="search-input" placeholder="Buscar por nombre o área..." oninput="renderLista()">
      </div>
    </div>

    <div class="emp-list" id="empList">
      <div class="empty-state"><i class="fas fa-satellite-dish fa-spin"></i><p>Conectando satélites...</p></div>
    </div>

    <div class="sb-footer">
      <button class="btn-action" id="btnRefresh" onclick="cargar(false)">
        <i class="fas fa-rotate" id="refreshIcon"></i> <span id="refreshText">Actualizar Radar</span>
      </button>
    </div>
  </aside>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="./JS/ubicacion_core.js?v=20260703_9"></script>
</body>
</html>
