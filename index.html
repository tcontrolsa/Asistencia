<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

    <!-- ===== PWA META TAGS ===== -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TCONTROL">
    <meta name="application-name" content="TCONTROL">
    <meta name="theme-color" content="#dc2626">
    <meta name="description" content="Sistema de control de asistencia TCONTROL S.A.">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <!-- ========================= -->

    <title>TCONTROL - Asistencia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        media="print" onload="this.media='all'">

    <link rel="stylesheet" href="./CSS/index.css?v=20260825_10">
    <!-- ===== FIREBASE SDKS & BACKEND ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="./JS/firebase_backend.js?v=20260825_10"></script>

    <script>
        // FIREBASE POR DEFECTO PARA TODOS LOS USUARIOS
        // Se puede desactivar localmente desde la consola con: localStorage.setItem('tcontrol_use_firebase', 'false')
        const storedFirebaseSetting = localStorage.getItem('tcontrol_use_firebase');
        window.USE_FIREBASE = (storedFirebaseSetting !== 'false'); 
    </script>
    <!-- =================================== -->
</head>

<body>
    <!-- STATIC SPLASH SCREEN (ANIMACIÓN INDUSTRIAL: GRÚA, BANDA, RAYO Y LOGO TRANSFORMADO) -->
    <div id="initialSplash" class="splash-screen">
        <div class="splash-body">
            
            <!-- ESCENARIO INDUSTRIAL INTERACTIVO -->
            <div class="splash-industrial-stage">
                
                <!-- 1. GRÚA CON CABLES Y GANCHO -->
                <div class="crane-rig" aria-hidden="true">
                    <div class="crane-trolley"></div>
                    <div class="crane-cable-line"></div>
                    <div class="crane-hook-assembly">
                        <svg viewBox="0 0 50 35" class="crane-hook-svg">
                            <path d="M 25,0 L 25,10 M 10,10 L 40,10 M 14,10 L 8,26 A 6,6 0 0,0 20,26 M 36,10 L 42,26 A 6,6 0 0,1 30,26" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <!-- 2. CONTENEDOR DEL LOGO (BAJADO POR LA GRÚA Y TRANSFORMADO POR EL RAYO) -->
                <div class="splash-logo-container">
                    <!-- Logo Inicial (Gris/Metálico) -->
                    <img src="./logo gris-blanco.png" alt="TCONTROL" class="splash-logo-img logo-state-initial"
                        onerror="this.src='./logo-blanco.png'">
                    
                    <!-- Logo Transformado (Vibrante Rojo y Blanco con Rayo) -->
                    <img src="./logo rojo_blanco.png" alt="TCONTROL" class="splash-logo-img logo-state-transformed"
                        onerror="this.src='./logo-blanco.png'">

                    <div id="splashLogoFallback" style="display:none;" class="splash-logo">🛡️</div>

                    <!-- 3. ANIMACIÓN DE RAYO SOBRE LA LETRA N -->
                    <div class="lightning-strike-container" aria-hidden="true">
                        <svg class="lightning-bolt-svg" viewBox="0 0 100 200" preserveAspectRatio="none">
                            <defs>
                                <filter id="lightningGlow" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur stdDeviation="3.5" result="blur1" />
                                    <feGaussianBlur stdDeviation="8" result="blur2" />
                                    <feMerge>
                                        <feMergeNode in="blur2" />
                                        <feMergeNode in="blur1" />
                                        <feMergeNode in="SourceGraphic" />
                                    </feMerge>
                                </filter>
                                <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#ffffff" />
                                    <stop offset="50%" stop-color="#ffffff" />
                                    <stop offset="85%" stop-color="#fffbeb" />
                                    <stop offset="100%" stop-color="#fde047" />
                                </linearGradient>
                            </defs>
                            <!-- Rayo principal cayendo directo a la N -->
                            <path class="lightning-path" d="M 65,-40 L 42,35 L 68,48 L 26,120 L 52,128 L 47,192" filter="url(#lightningGlow)" />
                            <!-- Ramificaciones eléctricas -->
                            <path class="lightning-branch" d="M 42,35 L 18,65" filter="url(#lightningGlow)" />
                            <path class="lightning-branch" d="M 26,120 L 8,145" filter="url(#lightningGlow)" />
                        </svg>
                        <div class="lightning-impact-glow"></div>
                        <div class="lightning-impact-spark"></div>
                    </div>

                    <!-- 4. ONDA EXPANSIVA ELÉCTRICA Y AURA NEÓN EXPANDIÉNDOSE DESDE LA LETRA N -->
                    <div class="logo-shockwave-container" aria-hidden="true">
                        <div class="shockwave-ring ring-1"></div>
                        <div class="shockwave-ring ring-2"></div>
                        <div class="shockwave-pulse-beam"></div>
                    </div>
                </div>

                <!-- 4. BANDA TRANSPORTADORA INDUSTRIAL CON RODILLOS EN MOVIMIENTO -->
                <div class="conveyor-belt-assembly" aria-hidden="true">
                    <div class="conveyor-track">
                        <div class="conveyor-treads"></div>
                    </div>
                    <div class="conveyor-rollers">
                        <div class="roller-wheel"><div class="wheel-spoke"></div></div>
                        <div class="roller-wheel"><div class="wheel-spoke"></div></div>
                        <div class="roller-wheel"><div class="wheel-spoke"></div></div>
                        <div class="roller-wheel"><div class="wheel-spoke"></div></div>
                        <div class="roller-wheel"><div class="wheel-spoke"></div></div>
                    </div>
                    <div class="conveyor-legs">
                        <div class="conveyor-leg leg-left"></div>
                        <div class="conveyor-leg leg-right"></div>
                    </div>
                </div>

            </div>
            
            <div class="splash-badge-year">2026</div>
            <div class="splash-subtitle">Control Biométrico de Asistencia</div>
        </div>

        <div class="splash-footer">
            <div class="splash-loader-bar">
                <div class="splash-loader-progress"></div>
            </div>
            <div class="splash-version-text">Sistema de Asistencia</div>
        </div>
    </div>

    <div class="app-container">
        <div class="status-bar"></div>
        <div class="main-content" id="mainContent"></div>
        <div class="bottom-nav" style="display: none;">
            <button class="nav-item active" data-page="home">
                <i class="fas fa-id-card"></i>
                <span>Credencial</span>
            </button>
            <button class="nav-item" id="navItemAlmuerzo" data-page="almuerzo">
                <i class="fas fa-utensils"></i>
                <span>Almuerzo</span>
            </button>
            <button class="nav-item" data-page="history">
                <i class="fas fa-chart-line"></i>
                <span>Resumen</span>
            </button>
            <button class="nav-item" id="navItemExtras" data-page="extras" style="display: none;">
                <i class="fas fa-clock"></i>
                <span>Extras</span>
            </button>
            <button class="nav-item" id="navItemPagos" data-page="pagos">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Pagos</span>
            </button>
            <button class="nav-item" id="navItemEstado" data-page="estado" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Estado</span>
            </button>
            <button class="nav-item" data-page="profile">
                <i class="fas fa-user-circle"></i>
                <span>Perfil</span>
            </button>
            <button class="nav-item" id="navItemAdmin" data-page="admin" style="display: none;">
                <i class="fas fa-lock"></i>
                <span>Master</span>
            </button>
        </div>
        <!-- ===== PWA INSTALL BANNER ===== -->
        <div id="pwaInstallBanner">
            <img src="./icon-192.png" alt="TCONTROL">
            <span>Instalar TCONTROL</span>
            <button class="pwa-close" id="pwaInstallClose" aria-label="Cerrar">×</button>
        </div>
        <!-- =============================== -->

        <div class="fab-whatsapp" id="fabWhatsApp" style="display: none;">
            <span class="whatsapp-tooltip">¿Necesitas soporte?</span>
            <button class="fab-whatsapp-btn" aria-label="Soporte Técnico">
                <i class="fab fa-whatsapp"></i>
                <span class="whatsapp-pulse"></span>
            </button>
        </div>

        <div class="fab-emergencia" id="fabEmergencia" style="display: none;">
            <span class="emergencia-tooltip">🚨 Reportar mi Estado</span>
            <button class="fab-emergencia-btn" onclick="navigateTo('estado')" aria-label="Reportar mi Estado">
                <i class="fas fa-exclamation-triangle"></i>
                <span class="emergencia-pulse"></span>
            </button>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">Procesando...</div>
            <div class="loading-subtext" id="loadingSubtext">Por favor espera un momento</div>
        </div>
    </div>

    <script src="./JS/tcontrol_core.js?v=20260825_10"></script>
    <script src="./JS/index_core.js?v=20260825_10"></script>
</body>

</html>
