<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

    <!-- ===== PWA META TAGS ===== -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TCONTROL">
    <meta name="application-name" content="TCONTROL">
    <meta name="theme-color" content="#1e40af">
    <meta name="description" content="Sistema de control de asistencia TCONTROL S.A.">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <!-- ========================= -->

    <title>TCONTROL - Asistencia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        media="print" onload="this.media='all'">

    <link rel="stylesheet" href="./CSS/index.css">
    <!-- ===== FIREBASE SDKS & BACKEND ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="./JS/firebase_backend.js"></script>

    <script>
        // FIREBASE POR DEFECTO PARA TODOS LOS USUARIOS
        // Se puede desactivar localmente desde la consola con: localStorage.setItem('tcontrol_use_firebase', 'false')
        const storedFirebaseSetting = localStorage.getItem('tcontrol_use_firebase');
        window.USE_FIREBASE = (storedFirebaseSetting !== 'false'); 
    </script>
    <!-- =================================== -->
</head>

<body>
    <!-- STATIC SPLASH SCREEN FOR PERFORMANCE -->
    <div id="initialSplash" class="splash-screen">
        <div class="splash-logo">🛡️</div>
        <div class="splash-title">CONTROL 2026</div>
        <div class="splash-subtitle">Sistema de Asistencia</div>
    </div>

    <div class="app-container">
        <div class="status-bar"></div>
        <div class="main-content" id="mainContent"></div>
        <div class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <i class="fas fa-id-card"></i>
                <span>Credencial</span>
            </button>
            <button class="nav-item" data-page="history">
                <i class="fas fa-chart-line"></i>
                <span>Resumen</span>
            </button>
            <button class="nav-item" id="navItemExtras" data-page="extras" style="display: none;">
                <i class="fas fa-clock"></i>
                <span>Extras</span>
            </button>
            <button class="nav-item" data-page="profile">
                <i class="fas fa-user-circle"></i>
                <span>Perfil</span>
            </button>
            <button class="nav-item" id="navItemAdmin" data-page="admin" style="display: none;">
                <i class="fas fa-lock"></i>
                <span>Master</span>
            </button>
        </div>
        <!-- ===== PWA INSTALL BANNER ===== -->
        <div id="pwaInstallBanner">
            <img src="./icon-192.png" alt="TCONTROL">
            <span>Instalar TCONTROL</span>
            <button class="pwa-close" id="pwaInstallClose" aria-label="Cerrar">×</button>
        </div>
        <!-- =============================== -->

        <button class="fab-whatsapp" id="fabWhatsApp" style="display: none;">
            <i class="fab fa-whatsapp"></i>
        </button>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <div class="loading-text">Procesando...</div>
        </div>
    </div>

    <script src="./JS/index_core.js"></script>
</body>

</html>
