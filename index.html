<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control 2026">
    <meta name="theme-color" content="#dc2626">
    <title>Control 2026 - Asistencia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fee2e2;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
        }

        body {
            background: linear-gradient(135deg, var(--gray-100) 0%, var(--gray-200) 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            background: var(--gray-100);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .status-bar {
            background: transparent;
            height: env(safe-area-inset-top, 44px);
            padding-top: env(safe-area-inset-top, 20px);
        }

        .main-content {
            height: calc(100vh - 70px - env(safe-area-inset-top));
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 16px 16px 0 16px;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
            padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 8px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            color: var(--gray-500);
            font-size: 12px;
            font-weight: 500;
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .employee-photo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .employee-photo-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: linear-gradient(145deg, var(--gray-100), var(--gray-200));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--gray-500);
            border: 3px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(220,38,38,0.4);
            cursor: pointer;
            transition: all 0.3s;
            z-index: 90;
            border: none;
        }

        .fab:active {
            transform: scale(0.9);
        }

        .timeline-item {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            border: 1px solid var(--gray-200);
        }

        .timeline-item:active {
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .timeline-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .timeline-icon.entry {
            background: linear-gradient(135deg, #dcfce7, #bbf7d0);
            color: #166534;
        }

        .timeline-icon.exit {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid var(--gray-200);
        }

        .stat-card:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .custom-toast {
            position: fixed;
            bottom: 90px;
            left: 16px;
            right: 16px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            font-size: 14px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .distance-indicator {
            position: fixed;
            bottom: 90px;
            left: 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            z-index: 90;
            pointer-events: none;
        }

        .distance-indicator.valid {
            background: rgba(34,197,94,0.9);
        }

        .distance-indicator.invalid {
            background: rgba(220,38,38,0.9);
        }

        .pin-input {
            text-align: center;
            letter-spacing: 8px;
            font-family: monospace;
            font-size: 28px;
            font-weight: 600;
            border: 2px solid var(--gray-200);
            border-radius: 16px;
            padding: 16px;
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .page {
            animation: pageEnter 0.3s ease;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .hidden {
            display: none !important;
        }

        .btn-lunch-option {
            background: var(--gray-50);
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-lunch-option.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .btn-lunch-option i {
            font-size: 24px;
            margin-bottom: 4px;
            color: var(--primary);
        }

        .time-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 2px solid var(--gray-200);
        }

        .time-card.entry {
            border-color: var(--success);
            background: linear-gradient(145deg, #ffffff, #dcfce7);
        }

        .time-card.exit {
            border-color: var(--danger);
            background: linear-gradient(145deg, #ffffff, #fee2e2);
        }

        .time-card.pending {
            border-color: var(--warning);
            background: linear-gradient(145deg, #ffffff, #fef9c3);
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 16px;
            }
            
            .employee-photo,
            .employee-photo-placeholder {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="status-bar"></div>
    <div class="main-content" id="mainContent"></div>
    <div class="bottom-nav">
        <button class="nav-item active" data-page="home">
            <i class="fas fa-id-card"></i>
            <span>Credencial</span>
        </button>
        <button class="nav-item" data-page="history">
            <i class="fas fa-chart-line"></i>
            <span>Resumen</span>
        </button>
        <button class="nav-item" data-page="profile">
            <i class="fas fa-user-circle"></i>
            <span>Perfil</span>
        </button>
    </div>
    <button class="fab" id="fabButton" style="display: none;">
        <i class="fas fa-qrcode"></i>
    </button>
</div>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
</div>

<script>
    // ========== CONFIGURACIÓN ==========
    const API_URL = 'https://script.google.com/macros/s/AKfycbwpG1d9FoP6Iqszcf0xWNxgB-f-pduqWLkPYOQ7fhyDZ4m0MXIEoG_cqgMOXr9mUd9C/exec';
    
    const LAT_EMPRESA = -0.1288771313385675;
    const LNG_EMPRESA = -78.47896772889067;
    const RADIO_METROS = 250;

    // ========== VARIABLES GLOBALES ==========
    let deviceToken = null;
    let posicion = { lat: null, lng: null };
    let gpsActivo = false;
    let registrosCompletos = [];
    let intervaloGPS = null;
    let currentPage = 'home';
    let isAuthenticated = false;

    let estado = {
        tieneEntrada: false,
        tieneSalida: false,
        horaEntrada: null,
        horaSalida: null,
        almuerzo: null,
        esSupervisor: false
    };

    let empleado = {
        id: '',
        nombre: '',
        area: '',
        foto_url: '',
        tipoRegistro: '',
        almuerzo: ''
    };

    // ========== FUNCIONES DE UI ==========
    function showLoading(show) {
        const loading = document.getElementById('loadingOverlay');
        if (loading) {
            if (show) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }
    }

    function mostrarToast(msg, tipo = 'info') {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.textContent = msg;
        if (tipo === 'error') toast.style.background = 'rgba(220,38,38,0.9)';
        if (tipo === 'success') toast.style.background = 'rgba(34,197,94,0.9)';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatearFechaCompleta() {
        return new Date().toLocaleDateString('es-EC', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function formatearFechaCorta() {
        const d = new Date();
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatearHora(fecha) {
        if (!fecha) return '--:--';
        try {
            const d = new Date(fecha);
            if (isNaN(d.getTime())) return '--:--';
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'p. m.' : 'a. m.';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${hours}:${minutes} ${ampm}`;
        } catch (e) {
            return '--:--';
        }
    }

    // ========== FUNCIONES DE DISTANCIA ==========
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function verificarDistanciaEmpresa() {
        if (!posicion.lat || !posicion.lng) {
            mostrarToast('Obteniendo ubicación...', 'info');
            return false;
        }
        const distancia = calcularDistancia(posicion.lat, posicion.lng, LAT_EMPRESA, LNG_EMPRESA);
        const indicator = document.getElementById('distanceIndicator');
        if (indicator) {
            indicator.textContent = `📍 ${Math.round(distancia)}m / ${RADIO_METROS}m`;
            indicator.classList.remove('hidden');
            
            if (distancia <= RADIO_METROS) {
                indicator.classList.add('valid');
                indicator.classList.remove('invalid');
                setTimeout(() => indicator.classList.add('hidden'), 3000);
                return true;
            } else {
                indicator.classList.add('invalid');
                indicator.classList.remove('valid');
                mostrarToast(`❌ Fuera del área (${Math.round(distancia)}m)`, 'error');
                return false;
            }
        }
        return false;
    }

    function solicitarPermisoGPS() {
        if (!navigator.geolocation) {
            mostrarToast('Geolocalización no soportada', 'error');
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                posicion = { lat: position.coords.latitude, lng: position.coords.longitude };
                gpsActivo = true;
                verificarDistanciaEmpresa();
            },
            (error) => {
                console.error('GPS error:', error);
                if (error.code === 1) {
                    mostrarToast('Permiso de ubicación denegado. Activa el GPS para registrar asistencia', 'error');
                } else {
                    mostrarToast('Error al obtener ubicación. Verifica que el GPS esté activo', 'error');
                }
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function iniciarGPS() {
        solicitarPermisoGPS();
        if (intervaloGPS) clearInterval(intervaloGPS);
        intervaloGPS = setInterval(solicitarPermisoGPS, 60000);
    }

    // ========== FUNCIÓN JSONP ==========
    function jsonpRequest(params) {
        return new Promise((resolve, reject) => {
            const callback = `callback_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
            window[callback] = function(data) {
                delete window[callback];
                if (script.parentNode) script.parentNode.removeChild(script);
                resolve(data);
            };
            
            const url = new URL(API_URL);
            url.searchParams.append('callback', callback);
            Object.keys(params).forEach(key => {
                if (params[key] !== undefined && params[key] !== null) {
                    url.searchParams.append(key, typeof params[key] === 'object' ? JSON.stringify(params[key]) : params[key].toString());
                }
            });
            
            const script = document.createElement('script');
            script.src = url.toString();
            script.onerror = () => {
                delete window[callback];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('Error de conexión con el servidor'));
            };
            document.body.appendChild(script);
        });
    }

    // ========== FUNCIONES DE AUTENTICACIÓN ==========
    function generarDeviceToken() {
        let token = localStorage.getItem('DEVICE_TOKEN');
        if (!token) {
            token = 'DEV_' + Math.random().toString(36).substr(2, 8).toUpperCase();
            localStorage.setItem('DEVICE_TOKEN', token);
        }
        return token;
    }

    function generarPIN() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // ========== FUNCIONES DE API ==========
    async function verificarDispositivoTienePIN(deviceToken) {
        return jsonpRequest({ accion: 'verificarDispositivo', deviceToken });
    }

    async function registrarDispositivoConPIN(empleadoId, pin, deviceToken) {
        return jsonpRequest({ accion: 'registrarDispositivo', empleadoId, pin, deviceToken });
    }

    async function verificarPINAPI(pin, deviceToken) {
        return jsonpRequest({ accion: 'verificarPIN', pin, deviceToken });
    }

    async function obtenerEstado(id, deviceToken) {
        return jsonpRequest({ accion: 'obtenerEstado', id, deviceToken });
    }

    async function guardarRegistroAPI(data) {
        return jsonpRequest({ accion: 'guardarRegistro', ...data });
    }

    async function obtenerRegistrosEmpleadoAPI(empleadoId) {
        return jsonpRequest({ accion: 'obtenerRegistros', empleadoId });
    }

    async function desvincularDispositivoAPI(empleadoId, deviceToken) {
        return jsonpRequest({ accion: 'desvincularDispositivo', empleadoId, deviceToken });
    }

    async function verificarTokenValidoAPI(token, empleadoId) {
        return jsonpRequest({ accion: 'verificarToken', token, empleadoId });
    }

    // ========== FUNCIONES DE REGISTRO ==========
    async function obtenerRegistrosEmpleado() {
        if (!empleado.id) return;
        try {
            const registros = await obtenerRegistrosEmpleadoAPI(empleado.id);
            registrosCompletos = registros || [];
            if (currentPage === 'home') cargarUltimosRegistros();
            if (currentPage === 'history') actualizarHistorial();
            if (currentPage === 'profile') calcularEstadisticas();
        } catch (error) {
            console.error('Error:', error);
        }
    }

    async function guardarRegistro(datos) {
        return guardarRegistroAPI(datos);
    }

    async function registrar() {
        if (!verificarDistanciaEmpresa()) return;
        
        showLoading(true);
        
        const datos = {
            id: empleado.id,
            nombre: empleado.nombre,
            tipo: empleado.tipoRegistro,
            almuerzo: empleado.almuerzo || '',
            lat: posicion.lat,
            lng: posicion.lng,
            dispositivo: deviceToken
        };
        
        try {
            const res = await guardarRegistro(datos);
            showLoading(false);
            
            if (res.error) {
                mostrarToast(res.error, 'error');
                return;
            }
            
            mostrarToast('Registro exitoso', 'success');
            
            const ahora = new Date();
            const horaActual = formatearHora(ahora);
            
            if (empleado.tipoRegistro === 'ENTRADA') {
                estado.tieneEntrada = true;
                estado.horaEntrada = horaActual;
                estado.almuerzo = empleado.almuerzo;
            } else {
                estado.tieneSalida = true;
                estado.horaSalida = horaActual;
            }
            
            await obtenerRegistrosEmpleado();
            if (currentPage === 'home') actualizarCredencialHome();
            mostrarToast('Registro completado', 'success');
        } catch (error) {
            showLoading(false);
            mostrarToast('Error al registrar: ' + error.message, 'error');
        }
    }

    function iniciarRegistro(tipo) {
        if (!verificarDistanciaEmpresa()) return;
        
        empleado.tipoRegistro = tipo;
        
        if (tipo === 'ENTRADA') {
            mostrarLunchSelector();
        } else {
            empleado.almuerzo = estado.almuerzo || '';
            registrar();
        }
    }

    function mostrarLunchSelector() {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="page">
                <div class="glass-card">
                    <h3 class="h4 fw-bold text-center mb-4">¿Dónde almuerzas?</h3>
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <div class="btn-lunch-option text-center" onclick="seleccionarAlmuerzo('SI')" id="lunchSi">
                                <i class="fas fa-building"></i>
                                <div class="fw-bold mt-1">Dentro de planta</div>
                                <small class="text-muted">Almuerzo en empresa</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="btn-lunch-option text-center" onclick="seleccionarAlmuerzo('NO')" id="lunchNo">
                                <i class="fas fa-home"></i>
                                <div class="fw-bold mt-1">Fuera de planta</div>
                                <small class="text-muted">Almuerzo externo</small>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-lg" onclick="confirmarAlmuerzo()" id="btnConfirmarAlmuerzo" disabled>
                            <i class="fas fa-check"></i> Confirmar y registrar
                        </button>
                        <button class="btn btn-outline-secondary" onclick="volverAHome()">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    let almuerzoSeleccionado = null;

    function seleccionarAlmuerzo(op) {
        almuerzoSeleccionado = op;
        const lunchSi = document.getElementById('lunchSi');
        const lunchNo = document.getElementById('lunchNo');
        const btnConfirmar = document.getElementById('btnConfirmarAlmuerzo');
        
        if (op === 'SI') {
            lunchSi.classList.add('selected');
            lunchNo.classList.remove('selected');
        } else {
            lunchNo.classList.add('selected');
            lunchSi.classList.remove('selected');
        }
        
        if (btnConfirmar) btnConfirmar.disabled = false;
    }

    function confirmarAlmuerzo() {
        if (almuerzoSeleccionado) {

    // ========== FUNCIONES DE VERIFICACIÓN ==========
    async function verificarPIN() {
        const pin = document.getElementById('pinInput').value.trim();
        if (!pin || pin.length < 4) {
            mostrarToast('Ingresa PIN de 4 dígitos', 'error');
            return;
        }
        
        showLoading(true);
        
        try {
            const res = await verificarPINAPI(pin, deviceToken);
            showLoading(false);
            
            if (res.error) {
                const pinResult = document.getElementById('pinResult');
                if (pinResult) {
                    pinResult.classList.remove('hidden');
                    pinResult.textContent = '❌ ' + res.error;
                }
                mostrarToast(res.error, 'error');
                return;
            }
            
            if (res.valido) {
                localStorage.setItem('SESSION_DATA', JSON.stringify({
                    empleadoId: res.empleado.id,
                    token: deviceToken,
                    timestamp: new Date().toISOString()
                }));
                
                estado = {
                    tieneEntrada: res.empleado.tieneEntrada || false,
                    tieneSalida: res.empleado.tieneSalida || false,
                    horaEntrada: res.empleado.horaEntrada || null,
                    horaSalida: res.empleado.horaSalida || null,
                    almuerzo: res.empleado.almuerzo || null,
                    esSupervisor: res.empleado.esSupervisor || false
                };
                
                empleado = {
                    id: res.empleado.id,
                    nombre: res.empleado.nombre || 'Empleado',
                    area: res.empleado.area || 'Área',
                    foto_url: res.empleado.foto_url || '',
                    tipoRegistro: '',
                    almuerzo: ''
                };
                
                isAuthenticated = true;
                await obtenerRegistrosEmpleado();
                renderHomePage();
                mostrarToast(`Bienvenido ${empleado.nombre}`, 'success');
                
                const btnSupervisor = document.getElementById('btnSupervisor');
                if (btnSupervisor && estado.esSupervisor) {
                    btnSupervisor.style.display = 'flex';
                }
            } else {
                mostrarToast('PIN incorrecto', 'error');
            }
        } catch (error) {
            showLoading(false);
            mostrarToast('Error de conexión: ' + error.message, 'error');
        }
    }

    async function confirmarRegistroInicial() {
        const empleadoId = document.getElementById('registroEmployeeId').value.trim();
        const pin = document.getElementById('registroPinDisplay').textContent;
        
        if (!empleadoId) {
            mostrarToast('Ingresa tu ID de empleado', 'error');
            return;
        }
        
        showLoading(true);
        
        try {
            const res = await registrarDispositivoConPIN(empleadoId, pin, deviceToken);
            showLoading(false);
            
            if (res.error) {
                mostrarToast(res.error, 'error');
                return;
            }
            
            if (res.ok) {
                mostrarToast(`Registro exitoso. Guarda tu PIN: ${pin}`, 'success');
                localStorage.setItem('SESSION_DATA', JSON.stringify({
                    empleadoId,
                    token: deviceToken,
                    timestamp: new Date().toISOString()
                }));
                
                const estadoRes = await obtenerEstado(empleadoId, null);
                if (!estadoRes.error) {
                    estado = {
                        tieneEntrada: estadoRes.tieneEntrada || false,
                        tieneSalida: estadoRes.tieneSalida || false,
                        horaEntrada: estadoRes.horaEntrada || null,
                        horaSalida: estadoRes.horaSalida || null,
                        almuerzo: estadoRes.almuerzo || null,
                        esSupervisor: estadoRes.esSupervisor || false
                    };
                    empleado = {
                        id: estadoRes.id,
                        nombre: estadoRes.nombre,
                        area: estadoRes.area,
                        foto_url: estadoRes.foto_url,
                        tipoRegistro: '',
                        almuerzo: ''
                    };
                    isAuthenticated = true;
                    await obtenerRegistrosEmpleado();
                    renderHomePage();
                }
            }
        } catch (error) {
            showLoading(false);
            mostrarToast('Error de conexión: ' + error.message, 'error');
        }
    }

    async function verificarDispositivoConPIN() {
        try {
            const res = await verificarDispositivoTienePIN(deviceToken);
            const verifyingScreen = document.getElementById('verifyingScreen');
            const pinScreen = document.getElementById('pinScreen');
            const registroScreen = document.getElementById('registroInicialScreen');
            
            if (verifyingScreen) verifyingScreen.classList.add('hidden');
            
            if (res && res.tienePin) {
                if (pinScreen) pinScreen.classList.remove('hidden');
                document.getElementById('pinInput')?.focus();
            } else {
                if (registroScreen) {
                    registroScreen.classList.remove('hidden');
                    document.getElementById('registroPinDisplay').textContent = generarPIN();
                }
            }
        } catch (error) {
            const verifyingScreen = document.getElementById('verifyingScreen');
            const pinScreen = document.getElementById('pinScreen');
            if (verifyingScreen) verifyingScreen.classList.add('hidden');
            if (pinScreen) pinScreen.classList.remove('hidden');
            mostrarToast('Error de conexión con el servidor', 'error');
        }
    }

    function actualizarHistorial() {
        const container = document.getElementById('historialRegistros');
        if (!container) return;
        
        if (registrosCompletos.length === 0) {
            container.innerHTML = '<p class="text-muted text-center">No hay registros disponibles</p>';
            return;
        }
        
        container.innerHTML = registrosCompletos.map(reg => `
            <div class="timeline-item">
                <div class="timeline-icon ${reg.tipo === 'ENTRADA' ? 'entry' : 'exit'}">
                    <i class="fas ${reg.tipo === 'ENTRADA' ? 'fa-sign-in-alt' : 'fa-sign-out-alt'}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="fw-bold">${reg.tipo}</div>
                    <small class="text-muted">${reg.fecha} - ${reg.hora}</small>
                </div>
                <div>
                    <span class="badge ${reg.almuerzo === 'SI' ? 'bg-success' : reg.almuerzo === 'NO' ? 'bg-warning' : 'bg-secondary'}">
                        ${reg.almuerzo === 'SI' ? 'Planta' : reg.almuerzo === 'NO' ? 'Fuera' : '-'}
                    </span>
                </div>
            </div>
        `).join('');
        
        // Actualizar resumen del día
        const hoy = new Date().toISOString().split('T')[0];
        const registrosHoy = registrosCompletos.filter(r => r.fecha === hoy);
        const entrada = registrosHoy.find(r => r.tipo === 'ENTRADA');
        const salida = registrosHoy.find(r => r.tipo === 'SALIDA');
        
        const resumenEntradaHora = document.getElementById('resumenEntradaHora');
        const resumenSalidaHora = document.getElementById('resumenSalidaHora');
        const resumenEntradaStatus = document.getElementById('resumenEntradaStatus');
        const resumenSalidaStatus = document.getElementById('resumenSalidaStatus');
        const resumenAlmuerzo = document.getElementById('resumenAlmuerzo');
        const resumenEstadoGeneral = document.getElementById('resumenEstadoGeneral');
        
        if (resumenEntradaHora) resumenEntradaHora.textContent = entrada ? formatearHora(entrada.timestamp || entrada.hora) : '--:--';
        if (resumenSalidaHora) resumenSalidaHora.textContent = salida ? formatearHora(salida.timestamp || salida.hora) : '--:--';
        
        if (resumenEntradaStatus) {
            resumenEntradaStatus.innerHTML = entrada ? '<i class="fas fa-check-circle"></i> Completada' : '<i class="fas fa-hourglass-half"></i> Pendiente';
            resumenEntradaStatus.className = entrada ? 'time-status completed' : 'time-status pending';
        }
        
        if (resumenSalidaStatus) {
            resumenSalidaStatus.innerHTML = salida ? '<i class="fas fa-check-circle"></i> Completada' : '<i class="fas fa-hourglass-half"></i> Pendiente';
            resumenSalidaStatus.className = salida ? 'time-status completed' : 'time-status pending';
        }
        
        if (resumenAlmuerzo) resumenAlmuerzo.textContent = entrada?.almuerzo === 'SI' ? '🍽️ Dentro de planta' : entrada?.almuerzo === 'NO' ? '🏠 Fuera de planta' : '❓ No registrado';
        
        if (resumenEstadoGeneral) {
            if (!entrada) {
                resumenEstadoGeneral.className = 'status-badge w-100 justify-content-center p-3 rounded-3 text-center bg-danger bg-opacity-10 text-danger';
                resumenEstadoGeneral.innerHTML = '<i class="fas fa-clock"></i> Jornada pendiente';
            } else if (entrada && !salida) {
                resumenEstadoGeneral.className = 'status-badge w-100 justify-content-center p-3 rounded-3 text-center bg-warning bg-opacity-10 text-warning';
                resumenEstadoGeneral.innerHTML = '<i class="fas fa-play-circle"></i> Jornada en curso';
            } else {
                resumenEstadoGeneral.className = 'status-badge w-100 justify-content-center p-3 rounded-3 text-center bg-success bg-opacity-10 text-success';
                resumenEstadoGeneral.innerHTML = '<i class="fas fa-check-circle"></i> Jornada completada';
            }
        }
    }

    function renderProfilePage() {
        const mainContent = document.getElementById('mainContent');
        const totalDias = new Set(registrosCompletos.map(r => r.fecha)).size;
        const totalRegistros = registrosCompletos.length;
        
        mainContent.innerHTML = `
            <div class="page">
                <div class="glass-card text-center">
                    <div class="photo-container d-inline-block">
                        <img id="profilePhoto" class="employee-photo hidden" src="" alt="Foto">
                        <div id="profilePhotoPlaceholder" class="employee-photo-placeholder d-inline-flex">👤</div>
                    </div>
                    <h3 class="fw-bold mt-3">${empleado.nombre || 'Empleado'}</h3>
                    <p class="text-muted">${empleado.area || 'Área'}</p>
                    <p class="text-muted"><i class="fas fa-id-card"></i> ID: ${empleado.id || '-'}</p>
                    ${estado.esSupervisor ? '<span class="badge bg-info text-white">Supervisor</span>' : ''}
                </div>
                
                <div class="glass-card mt-3">
                    <h5 class="fw-bold mb-3"><i class="fas fa-chart-bar"></i> Estadísticas de asistencia</h5>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="stat-card">
                                <div class="stat-value" id="statTotalDias">${totalDias}</div>
                                <small class="text-muted">Días trabajados</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-card">
                                <div class="stat-value" id="statTotalRegistros">${totalRegistros}</div>
                                <small class="text-muted">Total registros</small>
                            </div>
                        </div>
                    </div>
                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <div class="stat-card">
                                <div class="stat-value text-success" id="statEntradas">${registrosCompletos.filter(r => r.tipo === 'ENTRADA').length}</div>
                                <small class="text-muted">Entradas</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-card">
                                <div class="stat-value text-danger" id="statSalidas">${registrosCompletos.filter(r => r.tipo === 'SALIDA').length}</div>
                                <small class="text-muted">Salidas</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="glass-card mt-3">
                    <h5 class="fw-bold mb-3"><i class="fas fa-cog"></i> Configuración</h5>
                    <button class="btn btn-outline-danger w-100 mb-2" onclick="cerrarSesion()">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                    <button class="btn btn-outline-secondary w-100" onclick="location.reload()">
                        <i class="fas fa-sync-alt"></i> Actualizar Datos
                    </button>
                    <button class="btn btn-outline-primary w-100 mt-2" onclick="verificarDistanciaEmpresa()">
                        <i class="fas fa-map-marker-alt"></i> Verificar ubicación
                    </button>
                </div>
            </div>
        `;
        
        const profilePhoto = document.getElementById('profilePhoto');
        const profilePlaceholder = document.getElementById('profilePhotoPlaceholder');
        if (empleado.foto_url && empleado.foto_url.trim()) {
            profilePhoto.src = empleado.foto_url;
            profilePhoto.classList.remove('hidden');
            profilePlaceholder.classList.add('hidden');
        }
    }

    function calcularEstadisticas() {
        const totalDias = new Set(registrosCompletos.map(r => r.fecha)).size;
        const totalRegistros = registrosCompletos.length;
        const totalEntradas = registrosCompletos.filter(r => r.tipo === 'ENTRADA').length;
        const totalSalidas = registrosCompletos.filter(r => r.tipo === 'SALIDA').length;
        
        const statTotalDias = document.getElementById('statTotalDias');
        const statTotalRegistros = document.getElementById('statTotalRegistros');
        const statEntradas = document.getElementById('statEntradas');
        const statSalidas = document.getElementById('statSalidas');
        
        if (statTotalDias) statTotalDias.textContent = totalDias;
        if (statTotalRegistros) statTotalRegistros.textContent = totalRegistros;
        if (statEntradas) statEntradas.textContent = totalEntradas;
        if (statSalidas) statSalidas.textContent = totalSalidas;
    }

    async function cerrarSesion() {
        if (confirm('¿Cerrar sesión? Se eliminará el acceso de este dispositivo.')) {
            showLoading(true);
            if (empleado.id && deviceToken) {
                try {
                    await desvincularDispositivoAPI(empleado.id, deviceToken);
                } catch (e) {}
            }
            localStorage.clear();
            isAuthenticated = false;
            showLoading(false);
            location.reload();
        }
    }

    // ========== NAVEGACIÓN ==========
    function navigateTo(page) {
        currentPage = page;
        
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.dataset.page === page) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
        
        const fab = document.getElementById('fabButton');
        if (fab) {
            if (page === 'home' && isAuthenticated) {
                fab.style.display = 'flex';
            } else {
                fab.style.display = 'none';
            }
        }
        
        if (page === 'home') {
            renderHomePage();
        } else if (page === 'history') {
            renderHistoryPage();
        } else if (page === 'profile') {
            renderProfilePage();
        }
    }

    // ========== VERIFICACIÓN INICIAL ==========
    async function verificarEstadoInicial() {
        deviceToken = generarDeviceToken();
        iniciarGPS();
        
        // Crear elemento de distancia
        const distanceIndicator = document.createElement('div');
        distanceIndicator.id = 'distanceIndicator';
        distanceIndicator.className = 'distance-indicator hidden';
        document.body.appendChild(distanceIndicator);
        
        const sessionData = localStorage.getItem('SESSION_DATA');
        if (sessionData) {
            try {
                const data = JSON.parse(sessionData);
                if (data.empleadoId && data.token === deviceToken) {
                    showLoading(true);
                    const res = await obtenerEstado(data.empleadoId, null);
                    showLoading(false);
                    
                    if (!res.error) {
                        estado = {
                            tieneEntrada: res.tieneEntrada || false,
                            tieneSalida: res.tieneSalida || false,
                            horaEntrada: res.horaEntrada || null,
                            horaSalida: res.horaSalida || null,
                            almuerzo: res.almuerzo || null,
                            esSupervisor: res.esSupervisor || false
                        };
                        empleado = {
                            id: res.id,
                            nombre: res.nombre,
                            area: res.area,
                            foto_url: res.foto_url,
                            tipoRegistro: '',
                            almuerzo: ''
                        };
                        isAuthenticated = true;
                        await obtenerRegistrosEmpleado();
                        renderHomePage();
                        return;
                    }
                }
            } catch (e) {
                console.error('Error cargando sesión:', e);
            }
        }
        
        // Si no hay sesión válida, mostrar pantalla de autenticación
        isAuthenticated = false;
        renderAuthScreen();
    }

    // ========== INICIALIZACIÓN ==========
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                if (isAuthenticated) {
                    navigateTo(item.dataset.page);
                }
            });
        });
        
        const fab = document.getElementById('fabButton');
        if (fab) {
            fab.addEventListener('click', () => {
                mostrarToast('Función de QR próximamente', 'info');
            });
        }
        
        verificarEstadoInicial();
        
        setInterval(() => {
            if (isAuthenticated && empleado.id) {
                obtenerRegistrosEmpleado();
            }
        }, 30000);
    });
</script>
</body>
</html>
