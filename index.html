<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control 2026">
    <meta name="theme-color" content="#dc2626">
    <title>Control 2026 - Asistencia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fee2e2;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
        }

        body {
            background: linear-gradient(135deg, var(--gray-100) 0%, var(--gray-200) 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            background: var(--gray-100);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .status-bar {
            background: transparent;
            height: env(safe-area-inset-top, 44px);
            padding-top: env(safe-area-inset-top, 20px);
        }

        .main-content {
            height: calc(100vh - 70px - env(safe-area-inset-top));
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 16px 16px 0 16px;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
            padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 8px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            color: var(--gray-500);
            font-size: clamp(10px, 3vw, 12px);
            font-weight: 500;
        }

        .nav-item i {
            font-size: clamp(20px, 6vw, 24px);
        }

        .nav-item.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeOut 0.5s ease 2s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .splash-logo {
            width: min(100px, 25vw);
            height: min(100px, 25vw);
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: bounce 1s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .splash-logo i {
            font-size: min(48px, 12vw);
            color: var(--primary);
        }

        .splash-title {
            color: white;
            font-size: clamp(20px, 7vw, 28px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .splash-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: clamp(12px, 3.5vw, 14px);
            margin-top: 8px;
        }

        /* ========== CREDENCIAL PROFESIONAL RESPONSIVE ========== */
        .credencial-wrapper {
            padding: 4px;
        }

        .credencial-profesional {
            background: white;
            border-radius: clamp(24px, 6vw, 32px);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease;
        }

        /* Header con patrón */
        .credencial-header-profesional {
            background: linear-gradient(135deg, var(--primary) 0%, #991b1b 100%);
            padding: clamp(16px, 5vw, 20px) clamp(16px, 5vw, 24px);
            position: relative;
            overflow: hidden;
        }

        .credencial-header-profesional::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(255, 255, 255, 0.03) 20px,
                rgba(255, 255, 255, 0.03) 40px
            );
            animation: slidePattern 20s linear infinite;
        }

        @keyframes slidePattern {
            from {
                transform: translateX(0) translateY(0);
            }
            to {
                transform: translateX(50px) translateY(50px);
            }
        }

        .credencial-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 40px;
            margin-bottom: clamp(12px, 4vw, 16px);
        }

        .credencial-badge i {
            font-size: clamp(12px, 3.5vw, 14px);
        }

        .credencial-badge span {
            font-size: clamp(10px, 3vw, 12px);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .credencial-title {
            color: white;
            font-size: clamp(18px, 6vw, 24px);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .credencial-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(10px, 3vw, 12px);
            font-weight: 500;
        }

        /* Foto y nombre */
        .photo-name-section {
            padding: clamp(16px, 5vw, 24px) clamp(16px, 5vw, 24px) clamp(12px, 4vw, 16px) clamp(16px, 5vw, 24px);
            text-align: center;
            background: white;
        }

        .photo-frame {
            position: relative;
            display: inline-block;
            margin-bottom: clamp(12px, 4vw, 16px);
        }

        .employee-photo-profesional {
            width: clamp(80px, 25vw, 110px);
            height: clamp(80px, 25vw, 110px);
            border-radius: clamp(20px, 6vw, 28px);
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
            background: linear-gradient(145deg, var(--gray-100), var(--gray-200));
        }

        .employee-photo-placeholder-profesional {
            width: clamp(80px, 25vw, 110px);
            height: clamp(80px, 25vw, 110px);
            border-radius: clamp(20px, 6vw, 28px);
            background: linear-gradient(145deg, var(--gray-100), var(--gray-200));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(36px, 12vw, 48px);
            color: var(--gray-500);
            border: 4px solid white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .photo-verified {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            width: clamp(24px, 7vw, 28px);
            height: clamp(24px, 7vw, 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .photo-verified i {
            font-size: clamp(12px, 3.5vw, 14px);
        }

        .employee-name-profesional {
            font-size: clamp(18px, 5.5vw, 22px);
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            word-break: break-word;
        }

        .employee-department-profesional {
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--primary);
            font-weight: 600;
            background: var(--primary-light);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            margin-top: 8px;
        }

        /* Grid de información */
        .info-grid-profesional {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: var(--gray-200);
            margin: 0;
        }

        .info-item-profesional {
            background: white;
            padding: clamp(12px, 4vw, 14px) clamp(8px, 3vw, 12px);
            text-align: center;
        }

        .info-label-profesional {
            font-size: clamp(9px, 2.8vw, 10px);
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray-500);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-value-profesional {
            font-size: clamp(14px, 4.5vw, 16px);
            font-weight: 700;
            color: var(--gray-800);
        }

        .info-value-small {
            font-size: clamp(12px, 3.8vw, 13px);
            font-weight: 600;
            color: var(--gray-700);
        }

        /* Estado de asistencia */
        .status-section {
            padding: clamp(12px, 4vw, 16px) clamp(16px, 5vw, 24px);
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
            border-bottom: 1px solid var(--gray-200);
        }

        .status-title {
            font-size: clamp(10px, 3vw, 11px);
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray-500);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-align: center;
        }

        .status-grid {
            display: flex;
            justify-content: space-around;
            gap: clamp(8px, 2.5vw, 12px);
            flex-wrap: wrap;
        }

        .status-card {
            flex: 1;
            min-width: clamp(80px, 28vw, 100px);
            background: white;
            border-radius: 16px;
            padding: clamp(10px, 3.5vw, 12px) clamp(6px, 2vw, 8px);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid var(--gray-200);
        }

        .status-card.entry {
            border-left: 3px solid var(--success);
        }

        .status-card.exit {
            border-left: 3px solid var(--danger);
        }

        .status-card.lunch {
            border-left: 3px solid var(--warning);
        }

        .status-icon {
            font-size: clamp(18px, 5.5vw, 20px);
            margin-bottom: 6px;
        }

        .status-label {
            font-size: clamp(9px, 2.8vw, 10px);
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray-500);
            margin-bottom: 4px;
        }

        .status-value {
            font-size: clamp(11px, 3.5vw, 13px);
            font-weight: 700;
            color: var(--gray-800);
            word-break: break-word;
        }

        .status-value.success {
            color: var(--success);
        }

        .status-value.warning {
            color: var(--warning);
        }

        /* Footer con QR */
        .credencial-footer-profesional {
            padding: clamp(12px, 4vw, 16px) clamp(16px, 5vw, 24px);
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--gray-100);
            flex-wrap: wrap;
            gap: 12px;
        }

        .qr-code-area {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2.5vw, 12px);
        }

        .qr-icon {
            width: clamp(36px, 11vw, 44px);
            height: clamp(36px, 11vw, 44px);
            background: var(--gray-900);
            border-radius: clamp(10px, 3vw, 12px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-icon i {
            font-size: clamp(18px, 5.5vw, 24px);
            color: white;
        }

        .qr-info {
            display: flex;
            flex-direction: column;
        }

        .qr-label {
            font-size: clamp(8px, 2.5vw, 10px);
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray-500);
            letter-spacing: 0.5px;
        }

        .qr-value {
            font-size: clamp(11px, 3.5vw, 14px);
            font-weight: 700;
            color: var(--gray-800);
            font-family: monospace;
        }

        .validity-date {
            text-align: right;
        }

        .validity-label {
            font-size: clamp(8px, 2.5vw, 9px);
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray-500);
        }

        .validity-value {
            font-size: clamp(10px, 3vw, 12px);
            font-weight: 600;
            color: var(--gray-700);
        }

        /* Botones de acción */
        .action-buttons-profesional {
            display: flex;
            gap: clamp(8px, 2.5vw, 12px);
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .btn-action {
            flex: 1;
            padding: clamp(12px, 4vw, 14px);
            border: none;
            border-radius: 48px;
            font-size: clamp(12px, 3.8vw, 14px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-action:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .btn-entrada {
            background: linear-gradient(135deg, var(--success), #15803d);
            color: white;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-salida {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-supervisor {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            width: 100%;
            margin-top: 8px;
            border: none;
            border-radius: 48px;
            padding: clamp(12px, 4vw, 14px);
            font-weight: 700;
            font-size: clamp(12px, 3.8vw, 14px);
        }

        /* Modal para foto */
        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
            cursor: pointer;
        }

        .photo-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 16px;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Otras vistas responsive */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: clamp(20px, 6vw, 24px);
            padding: clamp(16px, 5vw, 20px);
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .history-group {
            margin-bottom: 24px;
        }

        .history-date {
            background: var(--gray-200);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: clamp(11px, 3.5vw, 13px);
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 12px;
            display: inline-block;
        }

        .history-item {
            background: white;
            border-radius: clamp(14px, 4.5vw, 16px);
            padding: clamp(12px, 4vw, 16px);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: clamp(12px, 4vw, 16px);
            border: 1px solid var(--gray-200);
            flex-wrap: wrap;
        }

        .history-icon {
            width: clamp(40px, 12vw, 48px);
            height: clamp(40px, 12vw, 48px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 6vw, 24px);
            flex-shrink: 0;
        }

        .history-content {
            flex: 1;
            min-width: 120px;
        }

        .history-time {
            font-size: clamp(12px, 3.8vw, 14px);
            font-weight: 600;
            color: var(--gray-800);
        }

        .history-type {
            font-size: clamp(10px, 3.2vw, 12px);
            color: var(--gray-500);
        }

        .history-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: clamp(10px, 3.2vw, 11px);
            font-weight: 600;
            flex-shrink: 0;
        }

        .time-card {
            background: white;
            border-radius: clamp(14px, 4.5vw, 16px);
            padding: clamp(12px, 4vw, 16px);
            text-align: center;
            border: 2px solid var(--gray-200);
        }

        .time-icon {
            font-size: clamp(24px, 7vw, 28px);
            margin-bottom: 8px;
        }

        .time-label {
            font-size: clamp(10px, 3vw, 11px);
        }

        .time-value {
            font-size: clamp(14px, 4.5vw, 18px);
            font-weight: 700;
            margin: 8px 0;
        }

        .time-status {
            font-size: clamp(10px, 3vw, 11px);
            padding: 4px 8px;
        }

        .lunch-info {
            border-radius: clamp(14px, 4.5vw, 16px);
            padding: clamp(12px, 4vw, 16px);
            gap: clamp(10px, 3vw, 12px);
        }

        .stat-card {
            border-radius: clamp(14px, 4.5vw, 16px);
            padding: clamp(12px, 4vw, 16px);
        }

        .stat-value {
            font-size: clamp(20px, 6vw, 1.5rem);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: clamp(40px, 12vw, 48px);
            height: clamp(40px, 12vw, 48px);
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .custom-toast {
            position: fixed;
            bottom: 90px;
            left: 16px;
            right: 16px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            font-size: clamp(12px, 3.8vw, 14px);
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .distance-indicator {
            position: fixed;
            bottom: 90px;
            left: 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: clamp(10px, 3vw, 12px);
            font-family: monospace;
            z-index: 90;
            pointer-events: none;
        }

        .pin-input {
            text-align: center;
            letter-spacing: 8px;
            font-family: monospace;
            font-size: clamp(24px, 7vw, 28px);
            font-weight: 600;
            border: 2px solid var(--gray-200);
            border-radius: 16px;
            padding: 16px;
        }

        .page {
            animation: pageEnter 0.3s ease;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .hidden {
            display: none !important;
        }

        .btn-lunch-option {
            background: var(--gray-50);
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: clamp(10px, 3.5vw, 12px);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-lunch-option.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .btn-lunch-option i {
            font-size: clamp(20px, 6vw, 24px);
            margin-bottom: 4px;
            color: var(--primary);
        }

        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: clamp(48px, 14vw, 56px);
            height: clamp(48px, 14vw, 56px);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex;

<script>

    function formatearFechaCompleta() {
        return new Date().toLocaleDateString('es-EC', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function formatearFechaCorta() {
        const d = new Date();
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatearHora(fecha) {
        if (!fecha) return '--:--';
        try {
            const d = new Date(fecha);
            if (isNaN(d.getTime())) return '--:--';
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'p. m.' : 'a. m.';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${hours}:${minutes} ${ampm}`;
        } catch (e) {
            return '--:--';
        }
    }

    function formatearFechaParaGrupo(fecha) {
        const f = new Date(fecha);
        const hoy = new Date();
        const ayer = new Date(hoy);
        ayer.setDate(ayer.getDate() - 1);
        
        if (f.toDateString() === hoy.toDateString()) {
            return 'Hoy';
        } else if (f.toDateString() === ayer.toDateString()) {
            return 'Ayer';
        } else {
            return f.toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long' });
        }
    }

    // ========== FUNCIÓN PARA MOSTRAR FOTO EN MODAL ==========
    function showPhotoModal(url) {
        if (!url || url.trim() === '') {
            mostrarToast('No hay foto disponible', 'info');
            return;
        }
        const modal = document.createElement('div');
        modal.className = 'photo-modal';
        modal.onclick = () => modal.remove();

        img.onerror = () => {
            modal.innerHTML = '<div style="color:white; text-align:center;"><i class="fas fa-image fa-4x mb-3"></i><br>No se pudo cargar la imagen</div>';
        };
        
        modal.appendChild(img);
        document.body.appendChild(modal);
    }

    // ========== FUNCIONES DE DISTANCIA ==========
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function verificarDistanciaEmpresa() {
        if (!posicion.lat || !posicion.lng) {
            mostrarToast('Obteniendo ubicación...', 'info');
            return false;
        }
        const distancia = calcularDistancia(posicion.lat, posicion.lng, LAT_EMPRESA, LNG_EMPRESA);
        const indicator = document.getElementById('distanceIndicator');
        if (indicator) {
            indicator.textContent = `📍 ${Math.round(distancia)}m / ${RADIO_METROS}m`;
            indicator.classList.remove('hidden');
            
            if (distancia <= RADIO_METROS) {
                indicator.classList.add('valid');
                indicator.classList.remove('invalid');
                setTimeout(() => indicator.classList.add('hidden'), 3000);
                return true;
            } else {
                indicator.classList.add('invalid');
                indicator.classList.remove('valid');
                mostrarToast(`❌ Fuera del área (${Math.round(distancia)}m)`, 'error');
                return false;
            }
        }
        return false;
    }

    function solicitarPermisoGPS() {
        if (!navigator.geolocation) {
            mostrarToast('Geolocalización no soportada', 'error');
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                posicion = { lat: position.coords.latitude, lng: position.coords.longitude };
                gpsActivo = true;
                verificarDistanciaEmpresa();
            },
            (error) => {
                console.error('GPS error:', error);
                if (error.code === 1) {
                    mostrarToast('Permiso de ubicación denegado. Activa el GPS para registrar asistencia', 'error');
                } else {
                    mostrarToast('Error al obtener ubicación. Verifica que el GPS esté activo', 'error');
                }
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function iniciarGPS() {
        solicitarPermisoGPS();
        if (intervaloGPS) clearInterval(intervaloGPS);
        intervaloGPS = setInterval(solicitarPermisoGPS, 60000);
    }

    // ========== FUNCIÓN JSONP ==========
    function jsonpRequest(params) {
        return new Promise((resolve, reject) => {
            const callback = `callback_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
            window[callback] = function(data) {
                delete window[callback];
                if (script.parentNode) script.parentNode.removeChild(script);
                resolve(data);
            };
            
            const url = new URL(API_URL);
            url.searchParams.append('callback', callback);
            Object.keys(params).forEach(key => {
                if (params[key] !== undefined && params[key] !== null) {
                    url.searchParams.append(key, typeof params[key] === 'object' ? JSON.stringify(params[key]) : params[key].toString());
                }
            });
            
            const script = document.createElement('script');
            script.src = url.toString();
            script.onerror = () => {
                delete window[callback];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('Error de conexión con el servidor'));
            };
            document.body.appendChild(script);
        });
    }

    function generarDeviceToken() {
        let token = localStorage.getItem('DEVICE_TOKEN');
        if (!token) {
            token = 'DEV_' + Math.random().toString(36).substr(2, 8).toUpperCase();
            localStorage.setItem('DEVICE_TOKEN', token);
        }
        return token;
    }

    function generarPIN() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // ========== FUNCIONES DE API ==========
    async function verificarDispositivoTienePIN(deviceToken) {
        return jsonpRequest({ accion: 'verificarDispositivo', deviceToken });

    async function registrarDispositivoConPIN(empleadoId, pin, deviceToken) {
        return jsonpRequest({ accion: 'registrarDispositivo', empleadoId, pin, deviceToken });
    }

        return jsonpRequest({ accion: 'verificarPIN', pin, deviceToken });
    }

    async function obtenerEstado(id, deviceToken) {

    // ========== FUNCIONES DE REGISTRO ==========
    async function obtenerRegistrosEmpleado() {
        if (!empleado.id) return;
        try {
            const registros = await obtenerRegistrosEmpleadoAPI(empleado.id);
            registrosCompletos = registros || [];
            if (currentPage === 'history') actualizarHistorialAgrupado();
            if (currentPage === 'profile') actualizarEstadisticasPerfil();
        } catch (error) {
            console.error('Error:', error);
        }
    }

    async function guardarRegistro(datos) {
        return guardarRegistroAPI(datos);
    }

    async function registrar() {
        if (!verificarDistanciaEmpresa()) return;
        
        showLoading(true);
        
        const datos = {
            id: empleado.id,
            nombre: empleado.nombre,
            tipo: empleado.tipoRegistro,
            almuerzo: empleado.almuerzo || '',
            lat: posicion.lat,
            lng: posicion.lng,
            dispositivo: deviceToken
        };
        
        try {
            const res = await guardarRegistro(datos);
            showLoading(false);
            
            if (res.error) {
                mostrarToast(res.error, 'error');
                return;
            }
            
            mostrarToast('Registro exitoso', 'success');
            
            const ahora = new Date();
            const horaActual = formatearHora(ahora);
            
            if (empleado.tipoRegistro === 'ENTRADA') {
                estado.tieneEntrada = true;
                estado.horaEntrada = horaActual;
                estado.almuerzo = empleado.almuerzo;
            } else {
                estado.tieneSalida = true;
                estado.horaSalida = horaActual;
            }
            
            await obtenerRegistrosEmpleado();
            if (currentPage === 'home') renderHomePage();
            if (currentPage === 'history') renderHistoryPage();
            mostrarToast('Registro completado', 'success');
        } catch (error) {
            showLoading(false);
            mostrarToast('Error al registrar: ' + error.message, 'error');
        }
    }

    // ========== VERIFICACIÓN DE PIN ==========
    async function verificarPIN() {
        const pin = document.getElementById('pinInput').value.trim();
        if (!pin || pin.length < 4) {
            mostrarToast('Ingresa PIN de 4 dígitos', 'error');
            return;
        }
        
        showLoading(true);
        
        try {
            const res = await verificarPINAPI(pin, deviceToken);
            showLoading(false);
            
            if (res.error) {
                const pinResult = document.getElementById('pinResult');
                if (pinResult) {
                    pinResult.classList.remove('hidden');
                    pinResult.textContent = '❌ ' + res.error;
                }
                mostrarToast(res.error, 'error');
                return;
            }
            
            if (res.valido) {
                localStorage.setItem('SESSION_DATA', JSON.stringify({
                    empleadoId: res.empleado.id,
                    token: deviceToken,
                    timestamp: new Date().toISOString()
                }));
                
                estado = {
                    tieneEntrada: res.empleado.tieneEntrada || false,
                    tieneSalida: res.empleado.tieneSalida || false,
                    horaEntrada: res.empleado.horaEntrada || null,
                    horaSalida: res.empleado.horaSalida || null,
                    almuerzo: res.empleado.almuerzo || null,
                    esSupervisor: res.empleado.esSupervisor || false
                };
                
                empleado = {
                    id: res.empleado.id,
                    nombre: res.empleado.nombre || 'Empleado',
                    area: res.empleado.area || 'Área',
                    foto_url: res.empleado.foto_url || '',
                    tipoRegistro: '',
                    almuerzo: ''
                };
                
                isAuthenticated = true;
                await obtenerRegistrosEmpleado();
                renderHomePage();
                mostrarToast(`Bienvenido ${empleado.nombre}`, 'success');
            } else {
                mostrarToast('PIN incorrecto', 'error');
            }
        } catch (error) {
            showLoading(false);
            mostrarToast('Error de conexión: ' + error.message, 'error');
        }
    }

            mostrarToast('Error de conexión: ' + error.message, 'error');

            const pinScreen = document.getElementById('pinScreen');
            const registroScreen = document.getElementById('registroInicialScreen');
            
            if (verifyingScreen) verifyingScreen.classList.add('hidden');
            
            if (res && res.tienePin) {
                if (pinScreen) pinScreen.classList.remove('hidden');
                document.getElementById('pinInput')?.focus();
            } else {
                if (registroScreen) {
                    registroScreen.classList.remove('hidden');
                    document.getElementById('registroPinDisplay').textContent = generarPIN();

            if (pinScreen) pinScreen.classList.remove('hidden');

    function actualizarHistorialAgrupado() {
        const container = document.getElementById('historialAgrupado');
        if (!container) return;
        
        if (registrosCompletos.length === 0) {
            container.innerHTML = '<p class="text-muted text-center py-3">No hay registros disponibles</p>';
            return;
        }
        
        // Agrupar por fecha
        const grupos = {};
        registrosCompletos.forEach(reg => {
            if (!grupos[reg.fecha]) {
                grupos[reg.fecha] = [];
            }
            grupos[reg.fecha].push(reg);
        });
        
        // Ordenar fechas descendente
        const fechasOrdenadas = Object.keys(grupos).sort((a, b) => new Date(b) - new Date(a));
        
        container.innerHTML = fechasOrdenadas.map(fecha => {
            const registrosDia = grupos[fecha].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            const entradaDia = registrosDia.find(r => r.tipo === 'ENTRADA');
            const salidaDia = registrosDia.find(r => r.tipo === 'SALIDA');
            
            return `
                <div class="history-group">
                    <div class="history-date">
                        <i class="far fa-calendar-alt me-1"></i> ${formatearFechaParaGrupo(fecha)}
                    </div>
                    ${registrosDia.map(reg => `
                        <div class="history-item">
                            <div class="history-icon ${reg.tipo === 'ENTRADA' ? 'entry' : 'exit'}">
                                <i class="fas ${reg.tipo === 'ENTRADA' ? 'fa-sign-in-alt' : 'fa-sign-out-alt'}"></i>
                            </div>
                            <div class="history-content">
                                <div class="history-time">${formatearHora(reg.timestamp || reg.hora)}</div>
                                <div class="history-type">${reg.tipo}</div>
                            </div>
                            <div class="history-badge ${reg.almuerzo === 'SI' ? 'si' : reg.almuerzo === 'NO' ? 'no' : ''}">
                                ${reg.almuerzo === 'SI' ? '🏢 Planta' : reg.almuerzo === 'NO' ? '🏠 Fuera' : '-'}
                            </div>
                        </div>
                    `).join('')}
                    ${entradaDia && salidaDia ? `
                        <div class="text-end mt-1 mb-2">
                            <small class="text-muted">
                                <i class="fas fa-chart-line"></i> Duración: 
                                ${calcularDuracion(entradaDia.timestamp || entradaDia.hora, salidaDia.timestamp || salidaDia.hora)}
                            </small>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    function calcularDuracion(entrada, salida) {
        try {
            const entradaDate = new Date(entrada);
            const salidaDate = new Date(salida);
            if (isNaN(entradaDate) || isNaN(salidaDate)) return '--';
            const diffMs = salidaDate - entradaDate;
            const diffHoras = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMinutos = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            return `${diffHoras}h ${diffMinutos}min`;
        } catch {
            return '--';
        }
    }

    // ========== CERRAR SESIÓN ==========
    async function cerrarSesion() {
        if (confirm('¿Cerrar sesión? Se eliminará el acceso de este dispositivo.')) {
            showLoading(true);
            if (empleado.id && deviceToken) {
                try {
                    await desvincularDispositivoAPI(empleado.id, deviceToken);

            }
            localStorage.clear();
            isAuthenticated = false;
            showLoading(false);
            location.reload();
        }

    // ========== NAVEGACIÓN ==========
    function navigateTo(page) {
        currentPage = page;
        
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.dataset.page === page) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
        
        const fab = document.getElementById('fabButton');
        if (fab) {
            fab.style.display = (page === 'home' && isAuthenticated) ? 'flex' : 'none';
        }
        
        if (page === 'home') {
            renderHomePage();
        } else if (page === 'history') {
            renderHistoryPage();
        } else if (page === 'profile') {
            renderProfilePage();
        }
    }

    // ========== VERIFICACIÓN INICIAL ==========
    async function verificarEstadoInicial() {
        showSplash();
        deviceToken = generarDeviceToken();
        iniciarGPS();
        
        // Crear elemento de distancia
        const distanceIndicator = document.createElement('div');
        distanceIndicator.id = 'distanceIndicator';
        distanceIndicator.className = 'distance-indicator hidden';
        document.body.appendChild(distanceIndicator);
        
        const sessionData = localStorage.getItem('SESSION_DATA');
        if (sessionData) {
            try {
                const data = JSON.parse(sessionData);
                if (data.empleadoId && data.token === deviceToken) {
                    showLoading(true);
                    const res = await obtenerEstado(data.empleadoId, null);
                    showLoading(false);
                    
                    if (!res.error) {
                        estado = {
                            tieneEntrada: res.tieneEntrada || false,
                            tieneSalida: res.tieneSalida || false,
                            horaEntrada: res.horaEntrada || null,
                            horaSalida: res.horaSalida || null,
                            almuerzo: res.almuerzo || null,
                            esSupervisor: res.esSupervisor || false
                        };
                        empleado = {
                            id: res.id,
                            nombre: res.nombre,
                            area: res.area,
                            foto_url: res.foto_url,
                            tipoRegistro: '',
                            almuerzo: ''
                        };
                        isAuthenticated = true;
                        await obtenerRegistrosEmpleado();
                        renderHomePage();
                        return;
                    }
                }
            } catch (e) {
                console.error('Error cargando sesión:', e);
            }
        }
        
        isAuthenticated = false;
        renderAuthScreen();
    }

    // ========== INICIALIZACIÓN ==========
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                if (isAuthenticated) {
                    navigateTo(item.dataset.page);
                }
            });
        });
        
        const fab = document.getElementById('fabButton');
        if (fab) {
            fab.addEventListener('click', () => {
                mostrarToast('Escanea tu código QR de empleado', 'info');
            });
        }
        
        verificarEstadoInicial();
        
        setInterval(() => {
            if (isAuthenticated && empleado.id) {
                obtenerRegistrosEmpleado();
            }
        }, 30000);
    });
</script>
</body>
</html>
