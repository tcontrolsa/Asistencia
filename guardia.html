<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control 2026 - Guardia">
    <meta name="theme-color" content="#dc2626">
    <title>Control 2026 - Terminal Guardia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="./CSS/guardia.css">
    <!-- FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="./JS/firebase_backend.js"></script>
    <script>window.USE_FIREBASE = true;</script>
</head>
<body>

<div class="app-container">
    <!-- Login -->
    <div id="vLogin">
        <div class="header">
            <h1>🔐 Terminal Guardia</h1>
            <p>Control de Asistencia</p>
        </div>
        <div class="main-content">
            <div class="card">
                <div class="mb-4 text-center">
                    <i class="fas fa-terminal fa-3x text-danger mb-3"></i>
                    <h2 class="h5 mb-1">Acceso de Seguridad</h2>
                    <p class="text-muted small">Ingrese la contraseña de terminal</p>
                </div>
                <div class="mb-4">
                    <input type="password" id="iClave" class="form-control" placeholder="••••••••" style="padding: 18px; border-radius: 48px; text-align: center; font-size: 24px; letter-spacing: 4px;">
                </div>
                <button class="btn-large btn-primary" onclick="login()">
                    <i class="fas fa-unlock-alt"></i> Activar Terminal
                </button>
            </div>
        </div>
    </div>

    <!-- Terminal Principal -->
    <div id="vTerm" class="hidden">
        <div class="header">
            <h1>📋 Terminal Guardia</h1>
            <p>Registro de asistencia</p>
        </div>
        
        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab active" onclick="cambiarTab('registro')">
                <i class="fas fa-clipboard-list"></i> Registrar
            </button>
            <button class="tab" onclick="cambiarTab('presentes')">
                <i class="fas fa-users"></i> Presentes
            </button>
        </div>
        
        <div class="main-content">
            
            <!-- GPS compacto -->
            <div class="gps-bar" id="gpsBar">
                <div class="gps-icon" id="gpsIcon">📡</div>
                <div class="gps-text">
                    <div class="gps-status" id="gpsStatus">Obteniendo GPS...</div>
                    <div class="gps-coord" id="gpsCoord">Esperando señal</div>
                </div>
                <i class="fas fa-sync-alt" onclick="refGPS()" style="color: var(--gray-500); cursor: pointer;"></i>
            </div>

            <!-- Panel Registrar -->
            <div id="panelRegistro">
                <!-- Pantalla de Búsqueda -->
                <div id="screenSearch">
                    <div class="card">
                        <input type="text" id="iId" class="form-control input-id" placeholder="ID" inputmode="numeric" autocomplete="off">
                        <button class="btn-large btn-primary" onclick="buscar()" style="margin-top: 20px;">
                            <i class="fas fa-search"></i> Buscar
                        </button>
                        <button class="btn-large btn-secondary" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Salir
                        </button>
                    </div>
                </div>

                <!-- Pantalla de Registro -->
                <div id="screenRegister" class="hidden">
                    <div class="card">
                        <!-- Perfil estilo credencial -->
                        <div id="profileInfo"></div>
                        
                        <!-- Opción de almuerzo (solo para entrada) -->
                        <div id="lunchSection" class="hidden">
                            <div class="lunch-row">
                                <div class="lunch-btn" id="lunchPlanta" onclick="seleccionarAlmuerzo('SI')">
                                    <i class="fas fa-building"></i>
                                    <span>En planta</span>
                                </div>
                                <div class="lunch-btn" id="lunchFuera" onclick="seleccionarAlmuerzo('NO')">
                                    <i class="fas fa-home"></i>
                                    <span>Fuera de planta</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Resumen -->
                        <div class="summary">
                            <div class="summary-row">
                                <span class="summary-label">Registro</span>
                                <span class="summary-value" id="sumTipo">-</span>
                            </div>
                            <div class="summary-row" id="sumAlmRow">
                                <span class="summary-label">Almuerzo</span>
                                <span class="summary-value" id="sumAlm">-</span>
                            </div>
                            <div class="summary-row">
                                <span class="summary-label">Ubicación</span>
                                <span class="summary-value" id="sumGps">-</span>
                            </div>
                        </div>
                        
                        <!-- Botones de acción -->
                        <button class="btn-large btn-success" id="btnRegistrar" onclick="registrar()">
                            <i class="fas fa-check-circle"></i> Registrar
                        </button>
                        
                        <button class="btn-large btn-secondary" onclick="volverABuscar()">
                            <i class="fas fa-arrow-left"></i> Buscar otro
                        </button>
                    </div>
                </div>
            </div>

            <!-- Panel Presentes -->
            <div id="panelPresentes" class="hidden">
                <div class="card">
                    <div class="present-count">
                        <i class="fas fa-user-check"></i>
                        <span id="presentCount">0</span> empleados presentes hoy
                    </div>
                    
                    <div id="presentList" class="present-list">
                        <div class="empty-state">
                            <i class="fas fa-users-slash"></i>
                            <p>Cargando lista de presentes...</p>
                        </div>
                    </div>
                    
                    <button class="btn-large btn-outline" onclick="cargarPresentes()" style="margin-top: 16px;">
                        <i class="fas fa-sync-alt"></i> Actualizar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
</div>
<div id="toastContainer" class="toast-container"></div>

<script src="./JS/guardia_core.js"></script>
</body>
</html>
